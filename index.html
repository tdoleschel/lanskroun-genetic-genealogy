, včetně regionálního projektu Lanškroun Region Project.", "article": "Výzkum byl rovněž publikován v českém genealogickém časopise „Genealogické a heraldické listy“.", "participate_title": "Zapojte se do projektu", "participate_text": "Hledáme muže s přímou otcovskou linií z tohoto regionu. Podle konkrétního případu lze využít Family Finder u FamilyTreeDNA nebo MyHeritage Y-DNA. Testy, které v rámci projektu zajišťuji, mohu financovat. Pokud první analýza ukáže R-P278, může následovat mnou financovaný test Big-Y pro přesnější určení otcovské linie.", "privacy_title": "Ochrana soukromí", "privacy_text": "Jména žijících testovaných osob nejsou zveřejňována. Veřejně jsou uváděny pouze historické genealogické údaje, místa původu a anonymizované výsledky genetického výzkumu. Osobní údaje DNA nejsou veřejně spojovány s identitou účastníka.", "cta_title": "Pochází vaše přímá otcovská linie z tohoto regionu?", "cta_text": "Vaše rodina může být součástí mnohem staršího příběhu.", "contact": "Kontakt na projekt", "footer": "Geneticko-genealogický projekt regionu Lanškroun · T. Doleschel"}};

function setLang(l){
 lang=l;localStorage.setItem('lang',l);document.documentElement.lang=l;
 document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll('[data-placeholder]').forEach(e=>e.placeholder=t(e.dataset.placeholder));
 document.querySelectorAll('.langs button').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));

 document.getElementById('statFamiliesLabel').textContent=lang==='de'?'Familien untersucht':lang==='cs'?'Zkoumané rodiny':'Families studied';

function markerIcon(){return L.divIcon({className:'',html:'<div class="marker"></div>',iconSize:[18,18],iconAnchor:[9,9]})}
function initMap(){
 map=L.map('map',{zoomControl:true,worldCopyJump:true,minZoom:2,maxZoom:14}).setView([49.96,16.60],9);
 L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap contributors &copy; CARTO',subdomains:'abcd',maxZoom:20}).addTo(map);
 markersLayer=L.layerGroup().addTo(map);
 const groups={};families.forEach(f=>(groups[f.place]??=[]).push(f));
 Object.entries(groups).forEach(([place,items])=>{
   const c=coords[place]||[49.96,16.60],marker=L.marker(c,{icon:markerIcon(),title:place}).addTo(markersLayer);
   marker.bindTooltip(place,{direction:'top',offset:[0,-10],opacity:.95});
   const rows=items.map(f=>`<div class="popup-item"><b>${esc(f.surname)}</b> · ${esc(f.ancestor||'—')} ${f.year?'· '+esc(f.year):''}<div><span style="color:#19d8ff;font-weight:800">${esc(f.haplogroup)}</span> · <a href="${ftdna(f.haplogroup)}" target="_blank">FTDNA ↗</a></div></div>`).join('');
   marker.bindPopup(`<div class="popup-title">${esc(place)}</div>${rows}`);
 });
}
function focusPlace(p){map.setView(coords[p]||[49.96,16.60],12,{animate:true,duration:.8});document.getElementById('map-section').scrollIntoView({behavior:'smooth'})}
function renderFamilies(){
 const q=document.getElementById('familySearch').value.trim().toLowerCase();
 const list=families.filter(f=>[f.surname,f.place,f.haplogroup,f.ancestor,f.year].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.surname.localeCompare(b.surname,'cs'));
 document.getElementById('familyGrid').innerHTML=list.map(f=>`<article class="family"><div><div class="family-name">${esc(f.surname)}</div><div class="family-meta"><a href="#" onclick="focusPlace('${esc(f.place).replace(/'/g,"\\\\'")}');return false">${esc(f.place)}</a> · ${esc(f.ancestor||'—')}${f.year?' · '+esc(f.year):''}</div></div><div><span style="color:#19d8ff;font-weight:900">${esc(f.haplogroup)}</span> <a class="ftdna" href="${ftdna(f.haplogroup)}" target="_blank">FTDNA ↗</a></div></article>`).join('');
}
document.getElementById('familySearch').addEventListener('input',renderFamilies);

function nodeHTML(n){
 const h=n.haplo?`<div class="hap">${esc(n.haplo)} <a href="${ftdna(n.haplo)}" target="_blank">FTDNA ↗</a></div>`:'';
 const d=n.tmrca?`<div class="date">TMRCA ${esc(n.tmrca)}</div>`:'';
 const fam=n.label?`<div class="fam">${esc(n.label)}</div>`:'';
 const meta=(n.ancestor||n.place||n.year)?`<div class="meta">${esc(n.ancestor||'')}${n.year?' · '+esc(n.year):''}${n.place?' · '+esc(n.place):''}</div>`:'';
 return `<div class="node">${h}${d}${fam}${meta}</div>`;
}
function childGroup(children,cls='branch'){return `<div class="${cls}">${children.map(ch=>`<div class="node-wrap">${nodeHTML(ch)}${ch.children?childGroup(ch.children,'subbranch'):''}</div>`).join('')}</div>`}
function renderTree(){document.getElementById('tree').innerHTML=`<div class="tree-root">${nodeHTML(treeData)}</div>${childGroup(treeData.children)}`}
function renderSteps(){
 const s=lang==='de'?['Direkte väterliche Herkunft aus der Region','Ältester bekannter väterlicher Vorfahr','MyHeritage Y-DNA oder Family Finder','Bei R-P278: Big-Y-Folgetest','Bei Bedarf weitere genealogische Recherche']:lang==='cs'?['Přímý otcovský původ z regionu','Nejstarší známý předek v otcovské linii','MyHeritage Y-DNA nebo Family Finder','Při R-P278: následný Big-Y','Podle potřeby další genealogický výzkum']:['Direct paternal origin in the region','Oldest known paternal ancestor','MyHeritage Y-DNA or Family Finder','If R-P278: Big-Y follow-up','Further genealogical research where needed'];
 document.getElementById('steps').innerHTML=s.map((x,i)=>`<div class="step"><b>0${i+1}</b>${x}</div>`).join('');
}
document.getElementById('statFamilies').textContent=families.length;
document.getElementById('statLineages').textContent=new Set(families.map(f=>f.haplogroup)).size;
document.getElementById('statPlaces').textContent=new Set(families.map(f=>f.place)).size;
initMap();setLang(lang);
</script></body></html>
