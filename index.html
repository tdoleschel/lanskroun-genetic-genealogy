const i18n={"de":{"brand":"LANDSKRON DNA","eyebrow":"T. DOLESCHEL · GENETISCHE GENEALOGIE","title":"Y-DNA Forschung in der Region Landskron","hero":"Forschung zu direkten väterlichen Abstammungslinien, alteingesessenen Familien und ihren genetischen Verbindungen in der Region Landskron, Letohrad, Ústí nad Orlicí und Umgebung.","hero_btn":"Was ist Y-DNA?","project_link":"FamilyTreeDNA – Lanškroun Region Project","nav_home":"Startseite","nav_ydna":"Was ist Y-DNA?","nav_results":"Ergebnisse","nav_map":"Genetische Karte","nav_families":"Familien","nav_participate":"Teilnahme","nav_privacy":"Datenschutzerklärung","ydna_title":"Was ist Y-DNA?","ydna":["Y-DNA wird ausschließlich entlang der direkten väterlichen Linie vom Vater an den Sohn weitergegeben. Ein Mann trägt daher auf seinem Y-Chromosom einen genetischen Abdruck seiner väterlichen Vorfahren, der über viele Generationen weitergegeben wird.","Durch die Untersuchung bestimmter Veränderungen auf dem Y-Chromosom können Männer anhand ihrer genetischen Gemeinsamkeiten verschiedenen väterlichen Linien zugeordnet werden. Diese genetischen Linien können anschließend zeitlich eingeordnet werden. Je weiter man in einem solchen Stammbaum zurückgeht, desto älter wird der gemeinsame väterliche Vorfahr eines Zweiges.","Für die genealogische Forschung ist besonders interessant, dass sich diese genetischen Linien mit alteingesessenen Familien und genealogischen Quellen vergleichen lassen. Wenn beispielsweise Männer mit unterschiedlichen heutigen Familiennamen denselben Y-DNA-Zweig teilen, bedeutet es, dass ihre direkten väterlichen Linien auf einen gemeinsamen Vorfahren zurückgehen, der vor der Entstehung der heutigen Familiennamen lebte.","Genau hier setzt dieses Projekt an: Die Ergebnisse der Y-DNA-Tests werden mit Kirchenbüchern, Grundbüchern und anderen historischen Quellen verbunden. Auf diese Weise lässt sich die Geschichte väterlicher Linien möglicherweise weiter zurückverfolgen, als es die schriftlichen Quellen allein erlauben."],"results_title":"Die Ergebnisse dieser Forschung","tree_title":"Die genetische Linie R-BY92362","family_connections_title":"Die Verbindung zu den historischen Familien","results_intro":["Das folgende Diagramm zeigt meine väterliche Linie (Haplogruppe) <strong>R-BY92362</strong> und ihre heute bekannten Unterzweige. Die angezeigten Jahreszahlen geben die von FamilyTreeDNA geschätzte Zeit des jeweils gemeinsamen väterlichen Vorfahren eines Zweiges an.","Die genetischen Ergebnisse werden hier mit den ältesten bisher bekannten Vorfahren aus den genealogischen Quellen verbunden. Dadurch lässt sich nachvollziehen, wie verschiedene heute bestehende Familiennamen auf eine einzige ältere gemeinsame väterliche Linie zurückführen.","Der <strong>gemeinsame Vorfahr dieser Linie</strong> lebte nach der derzeitigen Berechnung um das Jahr <strong>1293</strong>. Dies fällt in die Zeit der mittelalterlichen <strong>Besiedlung der Region Landskron</strong>, die vor allem im <strong>13. Jahrhundert</strong> erfolgte. Es ist daher sehr wahrscheinlich, dass <strong>R-BY92362 einen der frühen Siedler der Region oder einen unmittelbaren Nachkommen eines solchen Siedlers repräsentiert</strong>. Die darunterliegenden Zweige sind jünger und führen schließlich zu den historischen Familienlinien, die durch genealogische Quellen in der Region belegt werden konnten."],"familyIntro":[["Doležal / Doležel / Doleschel, Čenkovice","Meine eigene direkte väterliche Linie führt zu Jakub Doležal, der 1611 in Čenkovice ein Grundstück erwarb. Diese Linie ist heute dem genetischen Zweig <strong>R-FTA82359</strong> und seinen weiteren Unterzweigen zugeordnet."],["Knápek / Doležel, Cotkytle und Výprachtice","Der Vorfahr der Familie Knápek war Martin Knápek, auch Doležel genannt, der bereits im Jahr 1618 in Cotkytle genannt wird und aus Výprachtice stammte. Seine Linie ist dem Zweig <strong>R-FTD54476</strong> zugeordnet."],["Doleček, Mistrovice","Die Familie Doleček aus Mistrovice stammt von Jiří Doleček ab, der 1655 als Sohn von Václav Doleček in Mistrovice geboren wurde. Die Linie gehört zum Zweig <strong>R-FTD96496</strong> (unterhalb von <strong>R-Y414921</strong>) und dessen weiteren Unterzweigen."],["Dařílek, Dolní Heřmanice","Die Familie Dařílek stammt von Jakub Dařílek, geboren 1636 in Dolní Heřmanice, ab. Die Linie ist dem Zweig <strong>R-BY116135</strong> unterhalb von <strong>R-Y414921</strong> zugeordnet."],["Koblížek / Koblischke","Auch die Familie Koblížek beziehungsweise Koblischke, die lange die Erbrichterfamilie von <strong>Čenkovice</strong> war, stammt von <strong>R-BY92362</strong> ab. In den frühesten Quellen ist diese Familie bereits in <strong>Čenkovice, Bystřec, Jamné nad Orlicí und Jablonné nad Orlicí</strong> belegt."],["Kobliska, Střechov nad Sázavou","Ein weiterer Zweig führt zur Familie Kobliska. Der Vorfahr dieser Familie war Augustin Koblizek, der 1729 in <strong>Střechov nad Sázavou</strong> auftaucht. Aufgrund des Nachnamens ist es höchstwahrscheinlich, dass er aus der Region Landskron kam. Der entsprechende genetische Zweig lautet <strong>R-FTG95567</strong>."]],"map_title":"Genetische Karte","map_intro":"Die Karte zeigt die historischen Herkunftsorte der untersuchten direkten väterlichen Linien.","map_note":"Die DNA Marker zeigen den jeweiligen historischen Herkunftsort.","families_title":"Untersuchte Familien","search":"Nach Nachname, Ort oder Haplogruppe suchen …","ftdna":"FTDNA","participate_title":"Am Projekt teilnehmen","participate":["Gesucht werden Männer mit direkter väterlicher Abstammung aus der Region Landskron, Letohrad und Ústí nad Orlicí und Umgebung. Ich unterstütze Interessierte bei ihrer Familienforschung und stelle kostenlos einen Family Finder Test von FamilyTreeDNA zur Verfügung, bei dem auch die Y-DNA Haplogruppe bestimmt wird, oder einen MyHeritage DNA Test, bei dem ebenfalls die Haplogruppe bestimmt wird.","Falls ein Tester die Haplogruppe R-P278 hat, die Obergruppe meiner Haplogruppe R-BY92362, stelle ich kostenlos einen Big-Y Test von FamilyTreeDNA zur Verfügung. Mit diesem Test kann die genaue Untergruppe der väterlichen Linie bestimmt werden.","Mein Ziel ist es, alle Familien in der Region zu finden, die von meinem Vorfahren R-BY92362 abstammen, und gleichzeitig auch alle anderen väterlichen Linien aus der Region zu untersuchen."],"steps":["Direkte väterliche Abstammung aus der Region","Den ältesten bekannten Vorfahren der väterlichen Linie nennen und mich kontaktieren","Kostenloser MyHeritage DNA Test oder Family Finder Test von FamilyTreeDNA","Bei R-P278 kostenloser Big-Y Test von FamilyTreeDNA","Gemeinsame weitere Erforschung der Familiengeschichte"],"privacy_title":"Datenschutzerklärung","privacy":["Es werden keine Namen lebender DNA Tester veröffentlicht.","Öffentlich erscheinen nur genealogische Angaben zu historischen Vorfahren, Herkunftsorten und anonymisierte genetische Forschungsergebnisse.","Personenbezogene DNA Informationen werden nicht öffentlich mit der Identität eines Teilnehmers verknüpft."],"cta_title":"Stammt deine direkte väterliche Linie aus der Region?","cta_text":"Dann kontaktiere mich gerne.","contact":"Projektkontakt","privacy_link":"Datenschutzerklärung","footer":"Y-DNA Forschung in der Region Landskron","privacy_full":"<h3>1. Verantwortlicher</h3>\n<p>Verantwortlich für die Datenverarbeitung auf dieser Website ist:<br><strong>T. Doleschel</strong><br>E-Mail: <a href=\"mailto:familytreedna.doleschel@gmail.com\">familytreedna.doleschel@gmail.com</a></p>\n<p>Diese Website dient der privaten genealogischen und genetisch-genealogischen Forschung zu Familien und väterlichen Abstammungslinien aus der Region Landskron und den angrenzenden Gebieten.</p>\n\n<h3>2. Allgemeine Hinweise zur Datenverarbeitung</h3>\n<p>Personenbezogene Daten werden im Zusammenhang mit dieser Website nur verarbeitet, soweit dies für die Bereitstellung der Website, die Darstellung der Forschungsinhalte oder die Kommunikation im Rahmen des Forschungsprojekts erforderlich ist. Die Verarbeitung erfolgt nach Maßgabe der Datenschutz-Grundverordnung (DSGVO) und der sonstigen anwendbaren datenschutzrechtlichen Vorschriften.</p>\n\n<h3>3. Hosting über GitHub Pages</h3>\n<p>Diese Website wird über GitHub Pages, einen Dienst von GitHub, Inc., bereitgestellt. Beim Besuch der Website können technisch erforderliche Daten verarbeitet werden, insbesondere IP-Adresse, Datum und Uhrzeit des Zugriffs, aufgerufene Inhalte sowie Browser-, Geräte- und Verbindungsinformationen. GitHub gibt an, IP-Adressen von Besuchern einer GitHub-Pages-Website zu Sicherheitszwecken zu protokollieren und zu speichern.</p>\n<p>Weitere Informationen: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub General Privacy Statement</a>.</p>\n\n<h3>4. Leaflet, unpkg und OpenStreetMap</h3>\n<p>Für die interaktive Karte verwendet diese Website die JavaScript-Bibliothek Leaflet. Die dafür benötigten Leaflet-Dateien werden über das Content Delivery Network unpkg.com geladen. Beim Laden dieser Dateien wird eine Verbindung zu Servern des Anbieters hergestellt; dabei kann insbesondere die IP-Adresse des Besuchers übertragen werden.</p>\n<p>Die Kartendarstellung verwendet Kartenkacheln von OpenStreetMap. Beim Laden der Karte stellt der Browser eine Verbindung zur Infrastruktur her, über die diese Kartenkacheln bereitgestellt werden. Dabei können insbesondere IP-Adresse und technische Anfragedaten verarbeitet werden. Die Karte dient der geografischen Darstellung historischer Herkunftsorte der untersuchten Familienlinien.</p>\n<p>Weitere Informationen: <a href=\"https://osmfoundation.org/wiki/Privacy_Policy\" target=\"_blank\" rel=\"noopener noreferrer\">Datenschutzerklärung der OpenStreetMap Foundation</a>.</p>\n\n<h3>5. Genealogische Forschungsdaten</h3>\n<p>Auf dieser Website werden Ergebnisse genealogischer und genetisch-genealogischer Forschung dargestellt. Hierzu können insbesondere Familiennamen, Namen historischer Vorfahren, historische Lebensdaten und Herkunftsorte, genealogisch rekonstruierte Abstammungslinien sowie Y-DNA-Haplogruppen und deren Unterzweige gehören. Die Veröffentlichung dient der Erforschung und Dokumentation historischer väterlicher Abstammungslinien und ihrer Beziehungen zueinander.</p>\n\n<h3>6. Y-DNA-Daten und lebende Testteilnehmer</h3>\n<p><strong>Die Namen lebender DNA-Testteilnehmer werden auf dieser Website grundsätzlich nicht veröffentlicht.</strong> Die Darstellung erfolgt stattdessen anhand von Familiennamen, historischen Vorfahren, historischen Herkunftsorten und den für die jeweilige väterliche Linie ermittelten Y-DNA-Zweigen.</p>\n<p>Insbesondere werden grundsätzlich keine DNA-Rohdaten, vollständigen STR-Markerprofile, Listen privater genetischer Varianten, DNA-Kitnummern, privaten Anschriften oder sonstigen nicht für die Forschungsdarstellung erforderlichen Identifikationsdaten lebender Teilnehmer veröffentlicht. Bei der Veröffentlichung wird auf eine möglichst datensparsame Darstellung geachtet.</p>\n\n<h3>7. Genetische Daten</h3>\n<p>Genetische Daten einer identifizierten oder identifizierbaren natürlichen Person können besondere Kategorien personenbezogener Daten im Sinne von Art. 9 DSGVO darstellen. Soweit eine dargestellte genetische Information trotz der beschränkten Darstellung einer lebenden natürlichen Person zugeordnet werden kann, wird dies bei der datenschutzrechtlichen Bewertung der Veröffentlichung berücksichtigt. Soweit eine Veröffentlichung personenbezogener genetischer Daten auf einer Einwilligung beruht, kann diese mit Wirkung für die Zukunft widerrufen werden.</p>\n\n<h3>8. Angaben zu verstorbenen Personen</h3>\n<p>Der überwiegende Teil der namentlich dargestellten genealogischen Personen sind historische bzw. verstorbene Personen. Die DSGVO gilt grundsätzlich nicht für personenbezogene Daten Verstorbener. Dennoch wird darauf geachtet, durch historische Angaben nicht unnötig personenbezogene Informationen über heute lebende Angehörige offenzulegen.</p>\n\n<h3>9. FamilyTreeDNA und externe Links</h3>\n<p>Die Website enthält externe Links, insbesondere zu Informationsseiten von FamilyTreeDNA zu Y-DNA-Haplogruppen. Beim bloßen Anzeigen dieser Website wird die verlinkte Seite nicht automatisch aufgerufen. Erst beim Anklicken eines externen Links stellt der Browser eine Verbindung zum jeweiligen Anbieter her. Für die dortige Datenverarbeitung ist der jeweilige Betreiber verantwortlich.</p>\n\n<h3>10. Kontaktaufnahme per E-Mail</h3>\n<p>Bei einer Kontaktaufnahme per E-Mail werden die freiwillig übermittelten Daten, insbesondere E-Mail-Adresse, Nachrichteninhalt und gegebenenfalls Name, zur Bearbeitung der Anfrage und gegebenenfalls zur Kommunikation über genealogische Forschung oder eine Projektteilnahme verarbeitet.</p>\n\n<h3>11. Cookies, Werbung und Besucheranalyse</h3>\n<p>Der Betreiber dieser Website setzt nach der derzeitigen Gestaltung keine eigenen Analyse- oder Werbedienste wie Google Analytics, Google Ads oder Meta Pixel ein und erstellt keine eigenen personenbezogenen Besucherprofile zu Werbezwecken. Technisch erforderliche Verarbeitungen durch die eingebundenen Dienste bleiben hiervon unberührt.</p>\n\n<h3>12. Rechtsgrundlagen</h3>\n<p>Soweit personenbezogene Daten verarbeitet werden, richtet sich die Rechtsgrundlage nach Art und Zweck der jeweiligen Verarbeitung. Eine Verarbeitung zur Wahrung berechtigter Interessen kann insbesondere auf Art. 6 Abs. 1 lit. f DSGVO beruhen. Soweit eine Verarbeitung aufgrund einer Einwilligung erfolgt, richtet sie sich nach Art. 6 Abs. 1 lit. a DSGVO und bei besonderen Kategorien personenbezogener Daten gegebenenfalls zusätzlich nach Art. 9 Abs. 2 DSGVO.</p>\n\n<h3>13. Speicherdauer</h3>\n<p>Personenbezogene Daten werden nur so lange verarbeitet bzw. gespeichert, wie dies für den jeweiligen Zweck erforderlich ist oder eine Rechtsgrundlage für die weitere Aufbewahrung besteht. Für technische Daten, die unmittelbar von externen Anbietern verarbeitet werden, gelten zusätzlich deren jeweilige Speicher- und Löschregelungen. Genealogische Forschungsunterlagen können aufgrund ihres langfristigen Forschungs- und Dokumentationszwecks längerfristig aufbewahrt werden.</p>\n\n<h3>14. Rechte betroffener Personen</h3>\n<p>Soweit die gesetzlichen Voraussetzungen erfüllt sind, bestehen insbesondere Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit (soweit anwendbar), Widerspruch sowie Widerruf einer erteilten Einwilligung mit Wirkung für die Zukunft. Betroffene Personen haben außerdem das Recht, sich bei einer zuständigen Datenschutzaufsichtsbehörde zu beschweren.</p>\n<p>Anfragen: <a href=\"mailto:familytreedna.doleschel@gmail.com\">familytreedna.doleschel@gmail.com</a></p>\n\n<h3>15. Berichtigung und Entfernung von Forschungsdaten</h3>\n<p>Sollten dargestellte genealogische Angaben unrichtig sein oder sollte eine lebende Person der Ansicht sein, dass eine veröffentlichte Information ihre personenbezogenen Daten betrifft, kann sie sich jederzeit an die oben genannte E-Mail-Adresse wenden. Der Sachverhalt wird geprüft; soweit erforderlich, werden Angaben berichtigt, weiter anonymisiert oder entfernt.</p>\n\n<h3>16. Änderungen dieser Datenschutzerklärung</h3>\n<p>Diese Datenschutzerklärung kann angepasst werden, wenn sich die Website, die verwendeten technischen Dienste, die dargestellten Forschungsdaten oder die rechtlichen Anforderungen ändern.</p>\n<p><strong>Stand: August 2026</strong></p>"},"en":{"brand":"LANŠKROUN DNA","eyebrow":"T. DOLESCHEL · GENETIC GENEALOGY","title":"Y-DNA Research in the Lanškroun Region","hero":"Research into direct paternal lineages, long-established families and their genetic connections in the Lanškroun, Letohrad, Ústí nad Orlicí region and surrounding area.","hero_btn":"What is Y-DNA?","project_link":"FamilyTreeDNA – Lanškroun Region Project","nav_home":"Home","nav_ydna":"What is Y-DNA?","nav_results":"Results","nav_map":"Genetic Map","nav_families":"Families","nav_participate":"Participate","nav_privacy":"Privacy Policy","ydna_title":"What is Y-DNA?","ydna":["Y-DNA is passed exclusively along the direct paternal line, from father to son. A man therefore carries on his Y chromosome a genetic record of his paternal ancestors that can be passed down for many generations.","By examining specific changes on the Y chromosome, men can be assigned to different paternal lines based on their genetic similarities. These genetic lines can then be placed in a chronological context. The further back such a tree reaches, the older the shared paternal ancestor of a branch becomes.","For genealogical research, it is particularly interesting that these genetic lineages can be compared with long-established families and genealogical sources. If, for example, men with different present-day surnames share the same Y-DNA branch, it means that their direct paternal lines go back to a common ancestor who lived before the emergence of today's surnames.","This is where the project comes in: Y-DNA results are connected with church registers, land registers and other historical sources. In this way, the history of paternal lines may be traced further back than the written sources alone allow."],"results_title":"The Results of This Research","tree_title":"The Genetic Line R-BY92362","family_connections_title":"The Connection to the Historical Families","results_intro":["The following diagram shows my paternal lineage (haplogroup) <strong>R-BY92362</strong> and its currently known downstream branches. The years shown indicate FamilyTreeDNA's estimated time of the common paternal ancestor of each branch.","The genetic results are linked here with the earliest currently known ancestors from genealogical sources. This makes it possible to trace how different present-day surnames lead back to a single older shared paternal lineage.","The <strong>common ancestor of this lineage</strong> lived, according to the current estimate, around the year <strong>1293</strong>. This falls within the period of the medieval <strong>settlement of the Lanškroun region</strong>, which took place primarily during the <strong>13th century</strong>. It is therefore very likely that <strong>R-BY92362 represents one of the early settlers of the region or an immediate descendant of such a settler</strong>. The downstream branches are younger and ultimately lead to the historical family lineages that could be documented in the region through genealogical sources."],"familyIntro":[["Doležal / Doležel / Doleschel, Čenkovice","My own direct paternal line leads to Jakub Doležal, who acquired a property in Čenkovice in 1611. This line is now assigned to genetic branch <strong>R-FTA82359</strong> and its further subbranches."],["Knápek / Doležel, Cotkytle and Výprachtice","The ancestor of the Knápek family was Martin Knápek, also called Doležel, who is documented in Cotkytle in 1618 and came from Výprachtice. His line belongs to branch <strong>R-FTD54476</strong>."],["Doleček, Mistrovice","The Doleček family from Mistrovice descends from Jiří Doleček, who was born in Mistrovice in 1655 as the son of Václav Doleček. The line belongs to branch <strong>R-FTD96496</strong> (below <strong>R-Y414921</strong>) and its further downstream branches."],["Dařílek, Dolní Heřmanice","The Dařílek family descends from Jakub Dařílek, born in 1636 in Dolní Heřmanice. The line belongs to branch <strong>R-BY116135</strong> below <strong>R-Y414921</strong>."],["Koblížek / Koblischke","The Koblížek or Koblischke family, which for a long time was the hereditary reeve family of <strong>Čenkovice</strong>, also descends from <strong>R-BY92362</strong>. In the earliest sources, this family is already documented in <strong>Čenkovice, Bystřec, Jamné nad Orlicí and Jablonné nad Orlicí</strong>."],["Kobliska, Střechov nad Sázavou","Another branch leads to the Kobliska family. The ancestor of this family was Augustin Koblizek, who appears in <strong>Střechov nad Sázavou</strong> in 1729. Based on the surname, it is highly likely that he came from the Lanškroun region. The corresponding genetic branch is <strong>R-FTG95567</strong>."]],"map_title":"Genetic Map","map_intro":"The map shows the historical places of origin of the investigated direct paternal lines.","map_note":"The DNA markers show the respective historical place of origin.","families_title":"Investigated Families","search":"Search by surname, place or haplogroup …","ftdna":"FTDNA","participate_title":"Participate in the Project","participate":["Men with direct paternal ancestry from the Lanškroun, Letohrad and Ústí nad Orlicí region and surrounding area are sought. I support interested participants with their family research and provide a free Family Finder test from FamilyTreeDNA, which also determines the Y-DNA haplogroup, or a MyHeritage DNA test, which likewise determines the haplogroup.","If a tester has haplogroup R-P278, the parent group of my haplogroup R-BY92362, I provide a free Big-Y test from FamilyTreeDNA. This test can determine the precise subbranch of the paternal line.","My goal is to identify all families in the region who descend from my ancestor R-BY92362 while also investigating all other paternal lines from the region."],"steps":["Direct paternal ancestry from the region","Provide the oldest known paternal ancestor and contact me","Free MyHeritage DNA test or Family Finder test from FamilyTreeDNA","Free Big-Y test from FamilyTreeDNA if R-P278","Further family history research together"],"privacy_title":"Privacy Policy","privacy":["No names of living DNA testers are published.","Only genealogical information about historical ancestors, places of origin and anonymised genetic research results is published.","Personal DNA information is not publicly linked to the identity of a participant."],"cta_title":"Does your direct paternal line come from the region?","cta_text":"Then feel free to contact me.","contact":"Project contact","privacy_link":"Privacy Policy","footer":"Y-DNA Research in the Lanškroun Region","privacy_full":"<h3>1. Controller</h3>\n<p>The controller responsible for data processing on this website is:<br><strong>T. Doleschel</strong><br>Email: <a href=\"mailto:familytreedna.doleschel@gmail.com\">familytreedna.doleschel@gmail.com</a></p>\n<p>This website is a private genealogical and genetic-genealogy research project concerning families and paternal lineages from the Lanškroun region and surrounding areas.</p>\n\n<h3>2. General information on data processing</h3>\n<p>Personal data are processed in connection with this website only insofar as necessary to provide the website, present the research content or communicate in connection with the research project. Processing is carried out in accordance with the General Data Protection Regulation (GDPR) and other applicable data-protection rules.</p>\n\n<h3>3. Hosting via GitHub Pages</h3>\n<p>This website is hosted using GitHub Pages, a service provided by GitHub, Inc. When the website is visited, technically necessary data may be processed, including the IP address, date and time of access, requested content, and browser, device and connection information. GitHub states that visitors' IP addresses are logged and stored for security purposes when a GitHub Pages site is visited.</p>\n<p>Further information: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub General Privacy Statement</a>.</p>\n\n<h3>4. Leaflet, unpkg and OpenStreetMap</h3>\n<p>This website uses the Leaflet JavaScript library for its interactive map. The required Leaflet files are loaded through the unpkg.com content delivery network. Loading these files establishes a connection to the provider's servers and may transmit the visitor's IP address.</p>\n<p>The map uses map tiles from OpenStreetMap. When the map is loaded, the browser connects to the infrastructure serving these tiles. In particular, the IP address and technical request data may be processed. The map is used to display the historical places of origin of the researched family lineages.</p>\n<p>Further information: <a href=\"https://osmfoundation.org/wiki/Privacy_Policy\" target=\"_blank\" rel=\"noopener noreferrer\">OpenStreetMap Foundation Privacy Policy</a>.</p>\n\n<h3>5. Genealogical research data</h3>\n<p>This website presents results of genealogical and genetic-genealogy research. These may include surnames, names of historical ancestors, historical dates and places of origin, genealogically reconstructed lineages, and Y-DNA haplogroups and downstream branches. Publication serves the research and documentation of historical paternal lineages and their relationships.</p>\n\n<h3>6. Y-DNA data and living test participants</h3>\n<p><strong>The names of living DNA test participants are generally not published on this website.</strong> Instead, results are presented by reference to surnames, historical ancestors, historical places of origin and the Y-DNA branches identified for the relevant paternal lineage.</p>\n<p>In particular, raw DNA data, complete STR marker profiles, lists of private genetic variants, DNA kit numbers, private addresses and other identifying information about living participants that is not required for the research presentation are generally not published. Data minimisation is taken into account when publishing research results.</p>\n\n<h3>7. Genetic data</h3>\n<p>Genetic data relating to an identified or identifiable natural person may constitute special categories of personal data within the meaning of Article 9 GDPR. Where genetic information displayed on the website can nevertheless be attributed to a living person, this is taken into account when assessing the data-protection basis for publication. Where publication of personal genetic data is based on consent, that consent may be withdrawn with effect for the future.</p>\n\n<h3>8. Information concerning deceased persons</h3>\n<p>Most named genealogical individuals displayed on the website are historical or deceased persons. The GDPR does not generally apply to personal data relating to deceased persons. Nevertheless, care is taken not to disclose unnecessary personal information about living relatives through historical genealogical information.</p>\n\n<h3>9. FamilyTreeDNA and external links</h3>\n<p>The website contains external links, in particular to FamilyTreeDNA information pages concerning Y-DNA haplogroups. Merely viewing this website does not automatically open the linked website. A connection to the external provider is established only when the visitor clicks the link. The respective operator is responsible for data processing on the external website.</p>\n\n<h3>10. Contact by email</h3>\n<p>If you contact the project by email, the information you voluntarily provide, in particular your email address, message content and, where applicable, your name, is processed to respond to the enquiry and, where relevant, to communicate about genealogical research or participation in the project.</p>\n\n<h3>11. Cookies, advertising and visitor analytics</h3>\n<p>In its current configuration, the website operator does not use its own analytics or advertising services such as Google Analytics, Google Ads or Meta Pixel and does not create its own personal visitor profiles for advertising purposes. Technically necessary processing by the external services used by the website remains unaffected.</p>\n\n<h3>12. Legal bases</h3>\n<p>Where personal data are processed, the applicable legal basis depends on the nature and purpose of the processing. Processing necessary for legitimate interests may in particular be based on Article 6(1)(f) GDPR. Where processing is based on consent, Article 6(1)(a) GDPR applies and, for special categories of personal data, Article 9(2) GDPR may additionally apply.</p>\n\n<h3>13. Storage period</h3>\n<p>Personal data are processed or stored only for as long as necessary for the relevant purpose or as long as a legal basis for further retention exists. Technical data processed directly by external providers are additionally subject to their respective retention and deletion policies. Genealogical research material may be retained for longer periods because of its long-term research and documentation purpose.</p>\n\n<h3>14. Rights of data subjects</h3>\n<p>Where the statutory requirements are met, data subjects may in particular have rights of access, rectification, erasure, restriction of processing, data portability where applicable, objection, and withdrawal of consent with effect for the future. Data subjects also have the right to lodge a complaint with a competent data-protection supervisory authority.</p>\n<p>Requests: <a href=\"mailto:familytreedna.doleschel@gmail.com\">familytreedna.doleschel@gmail.com</a></p>\n\n<h3>15. Correction and removal of research data</h3>\n<p>If genealogical information displayed on this website is inaccurate, or if a living person believes that published information concerns their personal data, they may contact the email address above at any time. The matter will be reviewed and, where necessary, the information will be corrected, further anonymised or removed.</p>\n\n<h3>16. Changes to this Privacy Policy</h3>\n<p>This Privacy Policy may be amended if the website, the technical services used, the research data displayed or the applicable legal requirements change.</p>\n<p><strong>Last updated: August 2026</strong></p>"},"cs":{"brand":"LANŠKROUN DNA","eyebrow":"T. DOLESCHEL · GENETICKÁ GENEALOGIE","title":"Výzkum Y-DNA pro region Lanškroun","hero":"Výzkum přímých otcovských rodových linií, starousedlých rodin a jejich genetických vazeb v regionu Lanškroun, Letohrad, Ústí nad Orlicí a okolí.","hero_btn":"Co je Y-DNA?","project_link":"FamilyTreeDNA – Lanškroun Region Project","nav_home":"Úvod","nav_ydna":"Co je Y-DNA?","nav_results":"Výsledky","nav_map":"Genetická mapa","nav_families":"Rodiny","nav_participate":"Zapojení","nav_privacy":"Zásady ochrany osobních údajů","ydna_title":"Co je Y-DNA?","ydna":["Y-DNA se dědí výhradně v přímé otcovské linii, z otce na syna. Muž proto nese na chromozomu Y genetický otisk svých otcovských předků, který se může předávat po mnoho generací.","Zkoumáním určitých změn na chromozomu Y lze muže na základě jejich genetických shod přiřadit k různým otcovským liniím. Tyto genetické linie lze následně časově zařadit. Čím dále takový strom sahá do minulosti, tím starší je společný otcovský předek dané větve.","Pro genealogický výzkum je zvláště zajímavé, že tyto genetické linie lze porovnávat se starousedlými rodinami a genealogickými prameny. Pokud například muži s různými dnešními příjmeními sdílejí stejnou větev Y-DNA, znamená to, že jejich přímé otcovské linie vedou ke společnému předkovi, který žil před vznikem dnešních příjmení.","Právě na tom je tento projekt založen: výsledky testů Y-DNA jsou spojovány s matrikami, pozemkovými knihami a dalšími historickými prameny. Tímto způsobem lze historii otcovských linií sledovat možná dále do minulosti, než dovolují samotné písemné prameny."],"results_title":"Výsledky tohoto výzkumu","tree_title":"Genetická linie R-BY92362","family_connections_title":"Spojení s historickými rodinami","results_intro":["Následující diagram ukazuje mou otcovskou rodovou linii (haploskupinu) <strong>R-BY92362</strong> a její dnes známé podvětve. Uvedené letopočty označují odhadovaný čas společného otcovského předka jednotlivých větví podle FamilyTreeDNA.","Genetické výsledky jsou zde propojeny s nejstaršími dosud známými předky z genealogických pramenů. Díky tomu lze sledovat, jak různá dnešní příjmení vedou k jediné starší společné otcovské linii.","<strong>Společný předek této linie</strong> žil podle současného odhadu kolem roku <strong>1293</strong>. Toto období spadá do doby středověkého <strong>osidlování regionu Lanškroun</strong>, které probíhalo především ve <strong>13. století</strong>. Je proto velmi pravděpodobné, že <strong>R-BY92362 představuje jednoho z raných osadníků regionu nebo přímého potomka takového osadníka</strong>. Níže položené větve jsou mladší a nakonec vedou k historickým rodovým liniím, které se podařilo v regionu doložit genealogickými prameny."],"familyIntro":[["Doležal / Doležel / Doleschel, Čenkovice","Moje vlastní přímá otcovská linie vede k Jakubu Doležalovi, který v roce 1611 získal pozemek v Čenkovicích. Tato linie je dnes zařazena do genetické větve <strong>R-FTA82359</strong> a jejích dalších podvětví."],["Knápek / Doležel, Cotkytle a Výprachtice","Předkem rodiny Knápek byl Martin Knápek, také Doležel, který je doložen v Cotkytli již v roce 1618 a pocházel z Výprachtic. Jeho linie patří do větve <strong>R-FTD54476</strong>."],["Doleček, Mistrovice","Rodina Doleček z Mistrovic pochází od Jiřího Dolečka, který se narodil roku 1655 v Mistrovicích jako syn Václava Dolečka. Linie patří do větve <strong>R-FTD96496</strong> (pod <strong>R-Y414921</strong>) a jejích dalších podvětví."],["Dařílek, Dolní Heřmanice","Rodina Dařílek pochází od Jakuba Dařílka, narozeného v roce 1636 v Dolní Heřmanice. Linie patří do větve <strong>R-BY116135</strong> pod <strong>R-Y414921</strong>."],["Koblížek / Koblischke","Také rodina Koblížek, respektive Koblischke, která byla po dlouhou dobu dědičnou rychtářskou rodinou v <strong>Čenkovicích</strong>, pochází z <strong>R-BY92362</strong>. V nejstarších pramenech je tato rodina doložena již v <strong>Čenkovicích, Bystřeci, Jamném nad Orlicí a Jablonném nad Orlicí</strong>."],["Kobliska, Střechov nad Sázavou","Další větev vede k rodině Kobliska. Předkem této rodiny byl Augustin Koblizek, který se roku 1729 objevuje ve <strong>Střechově nad Sázavou</strong>. Vzhledem k příjmení je velmi pravděpodobné, že pocházel z regionu Lanškroun. Odpovídající genetická větev je <strong>R-FTG95567</strong>."]],"map_title":"Genetická mapa","map_intro":"Mapa zobrazuje historická místa původu zkoumaných přímých otcovských linií.","map_note":"DNA markery zobrazují příslušné historické místo původu.","families_title":"Zkoumané rodiny","search":"Hledat podle příjmení, místa nebo haploskupiny …","ftdna":"FTDNA","participate_title":"Zapojení do projektu","participate":["Hledám muže s přímým otcovským původem z oblasti Lanškroun, Letohrad a Ústí nad Orlicí a okolí. Zájemcům pomáhám s jejich rodinným výzkumem a poskytuji zdarma test Family Finder od FamilyTreeDNA, při kterém se určuje také haploskupina Y-DNA, nebo test MyHeritage DNA, při kterém se rovněž určuje haploskupina.","Pokud má tester haploskupinu R-P278, což je nadřazená skupina mé haploskupiny R-BY92362, poskytnu zdarma test Big-Y od FamilyTreeDNA. Ten umožní určit přesnou podvětev otcovské linie.","Mým cílem je najít všechny rodiny v regionu, které pocházejí od mého předka R-BY92362, a zároveň zkoumat i všechny další otcovské linie z tohoto regionu."],"steps":["Přímý otcovský původ z regionu","Uvést nejstaršího známého předka v otcovské linii a kontaktovat mě","Bezplatný test MyHeritage DNA nebo Family Finder od FamilyTreeDNA","Při R-P278 bezplatný test Big-Y od FamilyTreeDNA","Společný další výzkum rodinné historie"],"privacy_title":"Zásady ochrany osobních údajů","privacy":["Jména žijících DNA testerů nejsou zveřejňována.","Veřejně jsou uváděny pouze genealogické údaje o historických předcích, místech původu a anonymizované výsledky genetického výzkumu.","Osobní údaje DNA nejsou veřejně spojovány s identitou účastníka."],"cta_title":"Pochází vaše přímá otcovská linie z tohoto regionu?","cta_text":"Neváhejte mě kontaktovat.","contact":"Kontakt na projekt","privacy_link":"Zásady ochrany osobních údajů","footer":"Výzkum Y-DNA pro region Lanškroun","privacy_full":"<h3>1. Správce</h3>\n<p>Správcem odpovědným za zpracování osobních údajů na této webové stránce je:<br><strong>T. Doleschel</strong><br>E-mail: <a href=\"mailto:familytreedna.doleschel@gmail.com\">familytreedna.doleschel@gmail.com</a></p>\n<p>Tato webová stránka slouží soukromému genealogickému a geneticko-genealogickému výzkumu rodin a otcovských rodových linií z regionu Lanškroun a přilehlých oblastí.</p>\n\n<h3>2. Obecné informace o zpracování osobních údajů</h3>\n<p>Osobní údaje jsou v souvislosti s touto webovou stránkou zpracovávány pouze v rozsahu nezbytném pro její provoz, prezentaci výzkumného obsahu nebo komunikaci v rámci výzkumného projektu. Zpracování probíhá v souladu s obecným nařízením o ochraně osobních údajů (GDPR) a dalšími použitelnými předpisy o ochraně osobních údajů.</p>\n\n<h3>3. Hosting prostřednictvím GitHub Pages</h3>\n<p>Tato webová stránka je poskytována prostřednictvím služby GitHub Pages společnosti GitHub, Inc. Při návštěvě stránky mohou být zpracovávány technicky nezbytné údaje, zejména IP adresa, datum a čas přístupu, požadovaný obsah a informace o prohlížeči, zařízení a připojení. GitHub uvádí, že při návštěvě stránky GitHub Pages zaznamenává a uchovává IP adresy návštěvníků pro bezpečnostní účely.</p>\n<p>Další informace: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub General Privacy Statement</a>.</p>\n\n<h3>4. Leaflet, unpkg a OpenStreetMap</h3>\n<p>Pro interaktivní mapu používá tato stránka JavaScriptovou knihovnu Leaflet. Potřebné soubory Leaflet jsou načítány prostřednictvím sítě pro doručování obsahu unpkg.com. Při jejich načítání vzniká spojení se servery poskytovatele a může být přenesena zejména IP adresa návštěvníka.</p>\n<p>Mapa používá mapové dlaždice OpenStreetMap. Při načtení mapy se prohlížeč připojuje k infrastruktuře, která tyto dlaždice poskytuje. Mohou být zpracovávány zejména IP adresa a technické údaje o požadavku. Mapa slouží k zeměpisnému zobrazení historických míst původu zkoumaných rodových linií.</p>\n<p>Další informace: <a href=\"https://osmfoundation.org/wiki/Privacy_Policy\" target=\"_blank\" rel=\"noopener noreferrer\">Zásady ochrany osobních údajů OpenStreetMap Foundation</a>.</p>\n\n<h3>5. Genealogické výzkumné údaje</h3>\n<p>Na této stránce jsou zveřejňovány výsledky genealogického a geneticko-genealogického výzkumu. Mohou zahrnovat zejména příjmení, jména historických předků, historická data a místa původu, genealogicky rekonstruované rodové linie a haploskupiny Y-DNA včetně jejich podvětví. Zveřejnění slouží k výzkumu a dokumentaci historických otcovských rodových linií a jejich vzájemných vztahů.</p>\n\n<h3>6. Údaje Y-DNA a žijící testované osoby</h3>\n<p><strong>Jména žijících účastníků DNA testování nejsou na této webové stránce zásadně zveřejňována.</strong> Výsledky jsou místo toho zobrazovány prostřednictvím příjmení, historických předků, historických míst původu a větví Y-DNA zjištěných pro příslušnou otcovskou linii.</p>\n<p>Zásadně nejsou zveřejňována zejména surová data DNA, úplné profily markerů STR, seznamy soukromých genetických variant, čísla DNA kitů, soukromé adresy ani jiné identifikační údaje žijících účastníků, které nejsou pro prezentaci výzkumu nezbytné. Při zveřejňování je dbáno na minimalizaci údajů.</p>\n\n<h3>7. Genetické údaje</h3>\n<p>Genetické údaje identifikované nebo identifikovatelné fyzické osoby mohou představovat zvláštní kategorii osobních údajů ve smyslu čl. 9 GDPR. Pokud lze zveřejněnou genetickou informaci i přes omezený způsob zobrazení přiřadit žijící osobě, je tato skutečnost zohledněna při posouzení právního základu zveřejnění. Je-li zveřejnění osobních genetických údajů založeno na souhlasu, lze tento souhlas odvolat s účinky do budoucna.</p>\n\n<h3>8. Údaje o zemřelých osobách</h3>\n<p>Většina jmenovitě uvedených genealogických osob na této stránce jsou historické nebo zemřelé osoby. GDPR se obecně nevztahuje na osobní údaje zemřelých osob. Přesto je dbáno na to, aby historické genealogické údaje zbytečně neodhalovaly osobní informace o dnes žijících příbuzných.</p>\n\n<h3>9. FamilyTreeDNA a externí odkazy</h3>\n<p>Stránka obsahuje externí odkazy, zejména na informační stránky FamilyTreeDNA týkající se haploskupin Y-DNA. Pouhé zobrazení této stránky automaticky neotevírá odkazovanou webovou stránku. Spojení s externím poskytovatelem vznikne až po kliknutí na příslušný odkaz. Za zpracování údajů na externí stránce odpovídá její provozovatel.</p>\n\n<h3>10. Kontakt e-mailem</h3>\n<p>Při kontaktování projektu e-mailem jsou dobrovolně poskytnuté údaje, zejména e-mailová adresa, obsah zprávy a případně jméno, zpracovávány za účelem vyřízení dotazu a případné komunikace o genealogickém výzkumu nebo účasti v projektu.</p>\n\n<h3>11. Cookies, reklama a analýza návštěvnosti</h3>\n<p>Provozovatel v současné podobě stránky nepoužívá vlastní analytické ani reklamní služby, jako jsou Google Analytics, Google Ads nebo Meta Pixel, a nevytváří vlastní osobní profily návštěvníků pro reklamní účely. Tím nejsou dotčena technicky nezbytná zpracování prováděná externími službami použitými na této stránce.</p>\n\n<h3>12. Právní základy</h3>\n<p>Pokud jsou zpracovávány osobní údaje, právní základ závisí na povaze a účelu příslušného zpracování. Zpracování nezbytné pro oprávněné zájmy může být založeno zejména na čl. 6 odst. 1 písm. f) GDPR. Je-li zpracování založeno na souhlasu, použije se čl. 6 odst. 1 písm. a) GDPR a u zvláštních kategorií osobních údajů případně také čl. 9 odst. 2 GDPR.</p>\n\n<h3>13. Doba uchovávání</h3>\n<p>Osobní údaje jsou zpracovávány nebo uchovávány pouze po dobu nezbytnou pro příslušný účel nebo po dobu, po kterou existuje právní základ pro jejich další uchovávání. Na technické údaje zpracovávané přímo externími poskytovateli se navíc vztahují jejich vlastní pravidla uchovávání a mazání. Genealogické výzkumné materiály mohou být vzhledem ke svému dlouhodobému výzkumnému a dokumentačnímu účelu uchovávány delší dobu.</p>\n\n<h3>14. Práva subjektů údajů</h3>\n<p>Jsou-li splněny zákonné podmínky, mají subjekty údajů zejména právo na přístup, opravu, výmaz, omezen function renderFamilies(){
 const locale=lang==='cs'?'cs-CZ':lang==='de'?'de-DE':'en-US';
 const q=(document.getElementById('family-search').value||'').toLocaleLowerCase(locale).trim();
 const collator=new Intl.Collator(locale,{sensitivity:'base',numeric:true});
 const list=families.filter(f=>[f.surname,f.place,f.ancestor,f.haplogroup,f.year].join(' ').toLocaleLowerCase(locale).includes(q)).slice().sort((a,b)=>collator.compare(a.surname,b.surname)||collator.compare(a.place,b.place));
 document.getElementById('family-count').textContent=list.length+' / '+families.length;
 document.getElementById('family-grid').innerHTML=list.map(f=>`<article class="family-card"><h3>${esc(f.surname)}</h3><div class="meta">${esc(f.place)}${f.ancestor?' · '+esc(f.ancestor):''}${f.year?' · '+esc(f.year):''}</div><div class="bottom"><span class="hap">${esc(f.haplogroup)}</span><a class="ftdna" href="${ftdna(f.haplogroup)}" target="_blank" rel="noopener">${i18n[lang].ftdna}</a></div></article>`).join('');
}
