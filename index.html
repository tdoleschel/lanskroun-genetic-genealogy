.tree-scroll{position:relative;width:100%;overflow-x:auto;overflow-y:hidden;padding:4px 0 12px}
.tree-scroll::-webkit-scrollbar{height:8px}.tree-scroll::-webkit-scrollbar-thumb{background:#cfd8e3;border-radius:999px}
.tree-edge{stroke:#66bed0;stroke-width:3}
.tree-box{fill:#fff;stroke:#d5e0e7;stroke-width:1.4;filter:drop-shadow(0 7px 9px rgba(15,23,42,.05))}
.tree-root{fill:#061a29;stroke:#28c5df;stroke-width:2.2;filter:drop-shadow(0 11px 13px rgba(14,165,198,.18))}
.tree-root + .tree-hap{fill:#8deeff}
.tree-hap{fill:#087c96;font-weight:800}
.tree-family{fill:#101828;font-weight:800}.tree-meta{fill:#667085}
.tmrca-info{margin-top:8px!important;max-width:840px;color:#667085;font-size:.92rem;line-height:1.6}

.family-explanations{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.family-explanation{
  position:relative;
  overflow:hidden;
  padding:24px;
  border:1px solid #e3e9ef;
  border-radius:20px;
  background:#fff;
  box-shadow:0 8px 24px rgba(15,23,42,.04);
  transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.family-explanation::before{content:"";position:absolute;left:0;top:0;width:4px;height:100%;background:linear-gradient(#16b9d5,#7c5cff);opacity:.85}
.family-explanation:hover{transform:translateY(-3px);border-color:#cddce4;box-shadow:0 16px 38px rgba(15,23,42,.075)}
.family-explanation h3{margin:0 0 10px;color:#101828;font-size:1.02rem;letter-spacing:-.02em}
.family-explanation p{margin:0;color:#667085;font-size:.94rem}
.source-hint{color:#0a7f98;font-size:.88rem;font-weight:800}

.map-card{padding:0;overflow:hidden;border-radius:28px;background:#fff;box-shadow:0 18px 50px rgba(15,23,42,.07)}
.map-toolbar{display:flex;align-items:center;gap:14px;padding:16px 20px;background:#fff;border-bottom:1px solid #e7edf2}
.map-toolbar label{color:#344054;font-weight:750;font-size:.86rem}
.map-toolbar select,
.family-toolbar input{
  border:1px solid #d7e0e7;
  outline:0;
  border-radius:12px;
  background:#f8fafc;
  color:#101828;
  font:inherit;
  transition:border-color .18s ease,box-shadow .18s ease,background .18s ease;
}
.map-toolbar select{min-width:240px;padding:10px 38px 10px 13px}
.map-toolbar select:focus,.family-toolbar input:focus{border-color:#71ccdc;background:#fff;box-shadow:0 0 0 4px rgba(14,165,198,.10)}
#map{height:580px;width:100%;background:#dfe6ea}
.map-note{padding:13px 20px;color:#667085;font-size:.86rem;border-top:1px solid #e8edf1;background:#fff}
.map-legend-dot{width:10px;height:10px;background:#0ea5c6;border:2px solid #fff;box-shadow:0 0 0 2px rgba(14,165,198,.2)}
.marker-dot{width:17px;height:17px;border-radius:50%;background:#0ea5c6;border:3px solid #fff;box-shadow:0 4px 16px rgba(5,116,139,.45)}
.leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 14px 40px rgba(15,23,42,.16)}

.surname-faq-wrap{padding:4px 0 18px}
.surname-faq-toggle{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:17px 20px;
  border:1px solid #e1e7ed;
  border-radius:16px;
  color:#344054;
  background:#fff;
  box-shadow:0 5px 18px rgba(15,23,42,.035);
  font:inherit;font-weight:750;font-size:.96rem;text-align:left;cursor:pointer;
}
.surname-faq-toggle:hover{text-decoration:none;border-color:#cad7df;background:#fcfefe}
.surname-faq-arrow{display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:#eef7f9;color:#087c96;font-size:1rem}
.surname-faq-panel{margin-top:10px;padding:22px;border:1px solid #e1e7ed;border-radius:18px;background:#fff}
.surname-faq-item{padding:16px 0;border-bottom:1px solid #eef1f4}.surname-faq-item:first-child{padding-top:0}.surname-faq-item:last-child{padding-bottom:0;border-bottom:0}
.surname-faq-item h3{color:#101828}.surname-faq-item p{color:#667085}

.family-toolbar{display:flex;gap:14px;margin-bottom:20px;align-items:center}
.family-toolbar input{flex:1;padding:13px 16px;box-shadow:0 4px 12px rgba(15,23,42,.025)}
.family-count{color:#667085;font-size:.84rem;font-weight:700;white-space:nowrap}
.family-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}
.family-card{
  position:relative;
  overflow:hidden;
  min-height:138px;
  padding:19px;
  border:1px solid #e2e8ee;
  border-radius:18px;
  background:#fff;
  box-shadow:0 6px 20px rgba(15,23,42,.035);
  cursor:pointer;
  transition:transform .2s cubic-bezier(.2,.8,.2,1),box-shadow .2s ease,border-color .2s ease;
}
.family-card::after{content:"↗";position:absolute;right:16px;top:15px;color:#a4b0bd;font-size:.9rem;transition:transform .18s ease,color .18s ease}
.family-card:hover{transform:translateY(-4px);border-color:#bdd6de;box-shadow:0 16px 35px rgba(15,23,42,.075)}
.family-card:hover::after{color:#0b91ac;transform:translate(2px,-2px)}
.family-card h3{margin:0;padding-right:24px;color:#101828;font-size:1.02rem;font-weight:820;letter-spacing:-.02em}
.family-card .meta{margin-top:7px;color:#667085;font-size:.84rem;line-height:1.5}
.family-card .bottom{display:flex;align-items:center;gap:8px;margin-top:13px;flex-wrap:wrap}
.family-card .hap{display:inline-flex;padding:4px 9px;border-radius:999px;background:#e9f8fb;color:#087c96;font-size:.74rem;font-weight:800;letter-spacing:.01em}
.family-card .ftdna{font-size:.72rem;font-weight:800;color:#84919e}

.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.step{
  position:relative;
  overflow:hidden;
  min-height:170px;
  padding:22px 18px 20px;
  border:1px solid #e2e8ee;
  border-radius:20px;
  background:#fff;
  color:#475467;
  box-shadow:0 7px 20px rgba(15,23,42,.035);
  font-size:.91rem;
}
.step::after{content:"";position:absolute;width:120px;height:120px;border-radius:50%;right:-65px;bottom:-70px;background:radial-gradient(circle,rgba(14,165,198,.10),transparent 70%)}
.step b{display:block;margin-bottom:30px;color:#0b91ac;font-size:.78rem;font-weight:900;letter-spacing:.14em}
.step b::after{content:"";display:block;width:30px;height:2px;margin-top:10px;background:linear-gradient(90deg,#0ea5c6,#7c5cff)}

.cta{
  position:relative;
  overflow:hidden;
  padding:38px 40px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:28px;
  background:
    radial-gradient(circle at 85% 10%,rgba(14,165,198,.23),transparent 30%),
    linear-gradient(135deg,#081321,#102638);
  box-shadow:0 24px 60px rgba(15,23,42,.16);
}
.cta h2{margin:0 0 7px;color:#fff;font-size:clamp(1.45rem,2.7vw,2.05rem);letter-spacing:-.035em}
.cta p{margin:0;color:#aab8c5}
.cta .btn{flex:0 0 auto}

footer{border-top:1px solid #dde4ea;background:#eef2f5;margin-top:0}
.footerin{max-width:1320px;margin:auto;padding:30px 28px;color:#667085;font-size:.82rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.footerin a{color:#475467}.footerin a:hover{color:#087c96}.sep{opacity:.45}

.privacy-modal,.source-modal{background:rgba(2,8,23,.68);backdrop-filter:blur(12px)}
.privacy-dialog,.source-dialog{border:1px solid rgba(255,255,255,.12);border-radius:24px;background:#fff;box-shadow:0 35px 100px rgba(2,8,23,.35)}
.privacy-head,.source-head{background:rgba(255,255,255,.88);backdrop-filter:blur(18px);border-bottom:1px solid #e5eaf0}
.privacy-head h2,.source-head h2{color:#101828;letter-spacing:-.03em}
.privacy-close,.source-close{display:grid;place-items:center;width:38px;height:38px;padding:0;border:1px solid #dbe3e9;border-radius:11px;background:#f8fafc;color:#344054;font-size:1.25rem}
.privacy-body h3{color:#087c96}.privacy-body,.source-body{color:#344054}
.source-page{border-radius:12px;border:1px solid #dfe6eb;box-shadow:0 8px 28px rgba(15,23,42,.06)}

@media(max-width:1120px){
  .navlinks{max-width:62vw;overflow-x:auto;scrollbar-width:none}.navlinks::-webkit-scrollbar{display:none}
  .family-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{grid-template-columns:repeat(3,1fr)}
}
@media(max-width:800px){
  .navin{padding:0 18px;gap:10px}.brand{margin-right:auto}.navlinks{order:3;width:100%;max-width:none;margin:0 -18px;padding:0 18px 10px}.langs{margin-left:auto}
  main{padding:0 16px 70px}
  .hero{min-height:auto;margin-top:16px;padding:62px 23px 48px;border-radius:28px}.hero::before{width:340px;height:340px;right:-150px;top:80px}
  h1{font-size:clamp(2.7rem,13vw,4.2rem)}
  .section{padding:50px 0}.section-head{display:block}.section-head p{margin-top:9px}
  .family-explanations,.family-grid{grid-template-columns:1fr}
  .steps{grid-template-columns:repeat(2,1fr)}
  #map{height:460px}.map-toolbar{align-items:stretch;flex-direction:column}.map-toolbar select{width:100%}
  .cta{padding:30px 25px;flex-direction:column;align-items:flex-start}
}
@media(max-width:520px){
  .brand{font-size:.72rem;letter-spacing:.09em}.brand::before{width:27px;height:27px}.langs button{min-width:32px;padding:5px 7px}
  .hero{padding-top:52px}.hero p{font-size:1rem}.hero-actions{align-items:stretch}.hero-actions .btn{width:100%}
  .stats{grid-template-columns:1fr 1fr;margin-top:30px}.stat{padding:14px}.stat-number{font-size:1.65rem}.stat-label{font-size:.68rem}
  .card{padding:22px;border-radius:20px}
  .tree-wrap{padding:12px;border-radius:20px}.tree-scroll svg{min-width:1080px}
  .steps{grid-template-columns:1fr}.step{min-height:135px}.step b{margin-bottom:18px}
  .family-toolbar{align-items:stretch;flex-direction:column}.family-count{padding-left:2px}
  #map{height:420px}
  .privacy-modal,.source-modal{padding:8px}.privacy-dialog,.source-dialog{margin:8px auto;border-radius:18px}.privacy-body,.source-body{padding:18px}
}


/* ===== ULTRA MODERN / 3D REDESIGN ===== */
:root{
  --bg:#040816;
  --bg2:#09101f;
  --surface:rgba(9,16,30,.74);
  --surface2:rgba(10,18,34,.84);
  --surface3:rgba(255,255,255,.05);
  --text:#eaf1fb;
  --muted:#95a3bb;
  --line:rgba(255,255,255,.08);
  --accent:#59ecff;
  --accent2:#27c3df;
  --accent3:#8f6dff;
  --soft:rgba(89,236,255,.12);
  --shadow:0 20px 80px rgba(0,0,0,.32);
  --shadow-lg:0 40px 120px rgba(0,0,0,.45);
  --radius:28px;
}

html{scroll-padding-top:110px}
body{
  background:
    radial-gradient(circle at 10% 12%, rgba(39,195,223,.15), transparent 18rem),
    radial-gradient(circle at 88% 20%, rgba(143,109,255,.14), transparent 24rem),
    radial-gradient(circle at 55% 82%, rgba(89,236,255,.08), transparent 22rem),
    linear-gradient(180deg,#030713 0%,#040816 30%,#060c19 100%);
  color:var(--text);
}
body::before{
  opacity:.8;
  background-image:
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
  background-size:36px 36px;
  mask-image:linear-gradient(to bottom,black,rgba(0,0,0,.25));
}
body::after{
  content:"";
  position:fixed;
  inset:auto 0 0 0;
  height:38vh;
  pointer-events:none;
  background:linear-gradient(180deg,rgba(4,8,22,0),#040816 75%);
  z-index:-1;
}

a{color:#8cefff}
a:hover{color:#c8f8ff}

nav{
  top:14px;
  background:transparent;
  border:0;
  box-shadow:none;
}
.navin{
  max-width:1380px;
  min-height:76px;
  padding:0 22px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:24px;
  background:rgba(7,12,24,.6);
  backdrop-filter:blur(26px) saturate(160%);
  -webkit-backdrop-filter:blur(26px) saturate(160%);
  box-shadow:0 22px 55px rgba(0,0,0,.25);
}
.brand{color:#f5f9ff;font-size:.84rem;letter-spacing:.16em}
.brand::before{
  width:34px;height:34px;border-radius:12px;
  background:
    radial-gradient(circle at 34% 30%,#e7fbff 0 8%,transparent 9%),
    linear-gradient(135deg,#0a1630 5%, #0ecde8 58%, #8f6dff 100%);
  box-shadow:0 12px 28px rgba(89,236,255,.22), inset 0 0 14px rgba(255,255,255,.14);
}
.navlinks a{color:#a9b6ca;font-weight:700}
.navlinks a:hover{color:#fff;background:rgba(255,255,255,.06);box-shadow:none}
.langs{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.08);box-shadow:none}
.langs button{color:#b5c1d3}
.langs button.active{background:linear-gradient(135deg,#59ecff,#7d8bff);color:#04101c;box-shadow:0 8px 18px rgba(89,236,255,.18)}

main{max-width:1380px;padding:0 22px 100px}
.hero{
  position:relative;
  overflow:hidden;
  min-height:680px;
  margin-top:18px;
  padding:34px;
  border:1px solid rgba(255,255,255,.08);
  border-radius:38px;
  background:
    radial-gradient(circle at 82% 18%, rgba(89,236,255,.16), transparent 20%),
    radial-gradient(circle at 88% 78%, rgba(143,109,255,.14), transparent 22%),
    linear-gradient(135deg,rgba(7,12,24,.88) 0%,rgba(7,12,24,.72) 40%,rgba(8,20,36,.95) 100%);
  box-shadow:var(--shadow-lg);
}
.hero::before{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.7;
  background:
    linear-gradient(115deg,rgba(255,255,255,.07),transparent 22%),
    linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px);
  background-size:auto, 60px 60px, 60px 60px;
  mask-image:linear-gradient(135deg,black,rgba(0,0,0,.55));
}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(420px,.92fr);align-items:center;gap:24px;min-height:610px}
.hero-copy{position:relative;z-index:2;padding:26px 14px 26px 16px}
.eyebrow{
  color:#baf8ff;
  border-color:rgba(89,236,255,.22);
  background:rgba(255,255,255,.05);
}
.eyebrow::before{background:#59ecff;box-shadow:0 0 16px rgba(89,236,255,.95)}
h1{max-width:760px;font-size:clamp(3.2rem,6vw,6.3rem);line-height:.92;letter-spacing:-.075em;margin:20px 0 24px}
.hero p{max-width:760px;color:#b7c3d5;font-size:1.12rem}
.hero-pills{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 26px}
.hero-pill{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 14px;border:1px solid rgba(255,255,255,.09);border-radius:999px;
  background:rgba(255,255,255,.045);color:#d7e1ef;font-size:.83rem;font-weight:700;letter-spacing:.02em;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}
.hero-pill::before{content:"";width:7px;height:7px;border-radius:50%;background:linear-gradient(135deg,#59ecff,#8f6dff);box-shadow:0 0 12px rgba(89,236,255,.7)}
.hero-actions{margin-top:4px}
.btn{background:linear-gradient(135deg,#71f0ff,#41d5ea 55%,#79e5ff);color:#04111c;box-shadow:0 16px 40px rgba(24,211,236,.28)}
.btn:hover{background:linear-gradient(135deg,#96f5ff,#5edff1 55%,#99efff);box-shadow:0 18px 44px rgba(24,211,236,.34)}
.btn.secondary{color:#eff6ff;background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.12)}
.btn.secondary:hover{background:rgba(255,255,255,.11)}
.stats{margin-top:36px;grid-template-columns:repeat(2,minmax(0,220px));gap:14px}
.stat{
  position:relative;
  overflow:hidden;
  padding:20px 20px 18px;
  border-color:rgba(255,255,255,.1);
  background:linear-gradient(180deg,rgba(255,255,255,.085),rgba(255,255,255,.04));
  backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 18px 30px rgba(0,0,0,.16);
  transform:translateZ(0);
}
.stat::after{content:"";position:absolute;right:-28px;top:-34px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(89,236,255,.22),transparent 70%)}
.stat-number{font-size:2.2rem}
.stat-label{color:#b6c4d7}

.hero-scene{
  position:relative;
  min-height:560px;
  perspective:1400px;
  transform-style:preserve-3d;
}
.hero-glow{position:absolute;border-radius:50%;filter:blur(28px);opacity:.9}
.hero-glow-a{width:170px;height:170px;right:74px;top:42px;background:rgba(89,236,255,.22)}
.hero-glow-b{width:180px;height:180px;left:72px;bottom:66px;background:rgba(143,109,255,.18)}
.hero-orbit,.hero-ring{
  position:absolute;
  border-radius:50%;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.01);
}
.hero-orbit-1{inset:52px 72px 74px 72px;transform:rotateX(68deg) rotateZ(12deg);border-color:rgba(89,236,255,.18)}
.hero-orbit-2{inset:88px 104px 110px 104px;transform:rotateY(74deg) rotateZ(-10deg);border-color:rgba(143,109,255,.2)}
.hero-ring-1{width:250px;height:250px;left:50%;top:50%;transform:translate(-50%,-50%) rotateX(72deg);border-color:rgba(89,236,255,.18)}
.hero-ring-2{width:360px;height:360px;left:50%;top:50%;transform:translate(-50%,-50%) rotateY(72deg);border-color:rgba(143,109,255,.13)}
.hero-grid-lines{position:absolute;inset:72px;border-radius:30px;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.03) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(circle at center, black 30%, transparent 74%)}
.hero-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;transform-style:preserve-3d}
.hero-core{
  min-width:250px;
  padding:24px 28px;
  border:1px solid rgba(255,255,255,.11);
  border-radius:24px;
  background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,.05));
  backdrop-filter:blur(20px);
  text-align:center;
  box-shadow:0 30px 70px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.08);
  transform:translateZ(70px) rotateX(6deg);
}
.hero-core::before{content:"";position:absolute;inset:-1px;border-radius:24px;padding:1px;background:linear-gradient(135deg,rgba(89,236,255,.75),rgba(143,109,255,.6),transparent 75%);-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.hero-core-label{display:block;margin-bottom:8px;color:#b7c7d9;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;font-weight:800}
.hero-core strong{display:block;color:#fff;font-size:2.15rem;letter-spacing:-.05em}
.hero-core-meta{display:block;margin-top:8px;color:#9deeff;font-size:.86rem;font-weight:700}
.hero-float{
  position:absolute;
  width:220px;
  padding:16px 16px 15px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.045));
  backdrop-filter:blur(18px);
  box-shadow:0 22px 50px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.06);
  transform-style:preserve-3d;
}
.hero-float strong{display:block;margin-top:5px;color:#f3f8ff;font-size:1.02rem;line-height:1.25;letter-spacing:-.02em}
.hero-float small{display:block;margin-top:7px;color:#9ba9bc;font-size:.77rem;line-height:1.45}
.float-label{display:inline-block;color:#9deeff;font-size:.7rem;font-weight:850;letter-spacing:.18em;text-transform:uppercase}
.hero-float-left{left:8px;top:118px;transform:translateZ(42px) rotateX(12deg) rotateY(13deg);animation:floatCardA 7.5s ease-in-out infinite}
.hero-float-top{right:12px;top:92px;transform:translateZ(58px) rotateX(10deg) rotateY(-16deg);animation:floatCardB 8.6s ease-in-out infinite}
.hero-float-bottom{right:28px;bottom:78px;transform:translateZ(54px) rotateX(-8deg) rotateY(-10deg);animation:floatCardC 8s ease-in-out infinite}
.dna-ladder{position:absolute;left:72px;right:78px;bottom:36px;height:106px;display:flex;align-items:center;justify-content:space-between;transform:rotate(-7deg) translateZ(30px)}
.dna-ladder::before,.dna-ladder::after{content:"";position:absolute;left:0;right:0;height:2px;border-radius:999px;background:linear-gradient(90deg,rgba(89,236,255,.15),rgba(143,109,255,.42),rgba(89,236,255,.15))}

/* ===== CINEMATIC VIDEO INTRO ===== */
.intro-overlay{
  position:fixed;inset:0;z-index:20000;background:#02050b;
  display:grid;place-items:center;overflow:hidden;
  opacity:1;visibility:visible;
  transition:opacity .9s cubic-bezier(.2,.7,.2,1),visibility .9s;
}
.intro-overlay.is-hidden{opacity:0;visibility:hidden;pointer-events:none}
.intro-overlay::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(0,0,0,.08),transparent 55%,rgba(2,5,11,.5)),
    radial-gradient(circle at 50% 50%,transparent 48%,rgba(1,4,10,.22) 100%);
}
.intro-video{width:100%;height:100%;object-fit:cover;display:block}
.intro-skip{
  position:absolute;z-index:3;right:28px;top:28px;
  border:1px solid rgba(255,255,255,.18);border-radius:999px;
  padding:9px 14px;background:rgba(4,9,18,.45);backdrop-filter:blur(14px);
  color:#eef8ff;font:700 .78rem/1 Inter,system-ui,sans-serif;letter-spacing:.05em;
  cursor:pointer;transition:background .2s,border-color .2s,transform .2s;
}
.intro-skip:hover{background:rgba(9,20,34,.75);border-color:rgba(89,236,255,.4);transform:translateY(-1px)}
.intro-progress{position:absolute;z-index:3;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.08)}
.intro-progress span{display:block;width:0;height:100%;background:linear-gradient(90deg,#59ecff,#8f6dff);box-shadow:0 0 14px rgba(89,236,255,.45)}
body.intro-active{overflow:hidden}
.hero{transition:transform 1s cubic-bezier(.2,.7,.2,1),filter 1s,opacity 1s}
body.intro-active .hero{transform:scale(1.015);filter:blur(5px);opacity:.65}

}

const i18n={"de":{"stat_lines":"untersuchte Linien","stat_places":"Herkunftsorte","map_filter_label":"Familienname filtern","map_filter_all":"Alle Familien","map_haplogroup_filter_label":"Häufigste Haplogruppen","map_haplogroup_all":"Alle Haplogruppen","surname_faq_question":"Weshalb können Männer mit demselben Familiennamen unterschiedliche Y-DNA-Ergebnisse haben?","surname_faq_items":[["Unterschiedliche Testtiefe", "Nicht jeder Test bestimmt die Haplogruppe gleich genau. Ein Big-Y-Test liefert eine deutlich tiefere Untergruppe als zum Beispiel Family Finder (autosomaler Test) oder Y-37 (STR-Test). Zwei Ergebnisse können deshalb unterschiedlich aussehen, obwohl sie zur selben väterlichen Linie gehören."], ["Gleicher Name und gleicher Ort, aber andere Haplogruppe", "Dann gab es möglicherweise mehrere unabhängige Familien mit demselben Nachnamen im selben Ort. Möglich ist auch ein sogenanntes <strong>NPE</strong> (<em>Non-Paternity Event</em>). Dabei stimmt die biologische väterliche Linie an irgendeiner Stelle nicht mit der genealogisch dokumentierten Linie überein, zum Beispiel durch Adoption, ein uneheliches Kind, einen Stiefvater oder eine andere nicht dokumentierte Vaterschaftssituation."], ["Gleicher Name, anderer Ort, gleiche Haplogruppe", "Das spricht für einen gemeinsamen direkten männlichen Vorfahren. Seine Nachkommen könnten sich später in verschiedenen Dörfern niedergelassen haben."], ["Gleicher Name, anderer Ort, andere Haplogruppe", "Dann ist der gleiche Familienname höchstwahrscheinlich unabhängig voneinander entstanden und die Familien haben unterschiedliche väterliche Ursprünge. Möglich sind aber auch hier ein NPE oder andere historische Familienkonstellationen. Y-DNA und genealogische Quellen sollten deshalb immer gemeinsam betrachtet werden."]],"brand":"LANDSKRON DNA","eyebrow":"T. DOLESCHEL · GENETISCHE GENEALOGIE","title":"Y-DNA Forschung in der Region Landskron","hero":"Forschung zu direkten väterlichen Abstammungslinien, alteingesessenen Familien und ihren genetischen Verbindungen in der Region Landskron, Letohrad (Geiersberg), Ústí nad Orlicí (Wildenschwert) und Umgebung.","hero_pill_1":"Direkte väterliche Linien","hero_pill_2":"Genetik + Quellen","hero_pill_3":"Region Landskron","hero_scene_kicker":"Kernlinie","hero_scene_sub":"TMRCA ca. 1293","hero_scene_map_label":"Raumbezug","hero_scene_map_value":"Historische Orte","hero_scene_map_sub":"Lanškroun · Letohrad · Ústí n. O.","hero_scene_records_label":"Quellenbasis","hero_scene_records_value":"Kirchenbücher & Grundbücher","hero_scene_records_sub":"Genealogische Forschung mit Originalquellen","hero_scene_project_label":"Forschungsfokus","hero_scene_project_value":"Familien & Haplogruppen","hero_scene_project_sub":"Direkte väterliche Linien der Region","hero_btn":"Was ist Y-DNA?","intro_skip":"INTRO ÜBERSPRINGEN","project_link":"FamilyTreeDNA – Lanškroun Region Project","nav_home":"Startseite","nav_ydna":"Was ist Y-DNA?","nav_results":"Ergebnisse","nav_map":"Genetische Karte","nav_families":"Familien","nav_participate":"Teilnahme","nav_privacy":"Datenschutzerklärung","ydna_title":"Was ist Y-DNA?","ydna":["Y-DNA wird ausschließlich entlang der direkten väterlichen Linie vom Vater an den Sohn weitergegeben. Ein Mann trägt daher auf seinem Y-Chromosom einen genetischen Abdruck seiner väterlichen Vorfahren, der über viele Generationen weitergegeben wird.","Durch die Untersuchung bestimmter Veränderungen auf dem Y-Chromosom können Männer anhand ihrer genetischen Gemeinsamkeiten verschiedenen väterlichen Linien zugeordnet werden. Diese genetischen Linien können anschließend zeitlich eingeordnet werden. Je weiter man in einem solchen Stammbaum zurückgeht, desto älter wird der gemeinsame väterliche Vorfahr eines Zweiges.","Für die genealogische Forschung ist besonders interessant, dass sich diese genetischen Linien mit alteingesessenen Familien und genealogischen Quellen vergleichen lassen. Wenn beispielsweise Männer mit unterschiedlichen heutigen Familiennamen denselben Y-DNA-Zweig teilen, bedeutet es, dass ihre direkten väterlichen Linien auf einen gemeinsamen Vorfahren zurückgehen, der vor der Entstehung der heutigen Familiennamen lebte.","Genau hier setzt dieses Projekt an: Die Ergebnisse der Y-DNA-Tests werden mit Kirchenbüchern, Grundbüchern und anderen historischen Quellen verbunden. Auf diese Weise lässt sich die Geschichte väterlicher Linien möglicherweise weiter zurückverfolgen, als es die schriftlichen Quellen allein erlauben."],"results_title":"Die Ergebnisse dieser Forschung","tree_title":"Die genetische Linie R-BY92362","tmrca_info":"TMRCA steht für „Time to Most Recent Common Ancestor“ und bezeichnet die geschätzte Zeit bis zum jüngsten gemeinsamen väterlichen Vorfahren eines Y-DNA-Zweiges. Die angegebenen Jahreszahlen sind Schätzwerte von FamilyTreeDNA und keine exakt belegten Geburtsjahre.","family_connections_title":"Die Verbindung zu den historischen Familien","results_intro":["Das folgende Diagramm zeigt meine väterliche Linie (Haplogruppe) <strong>R-BY92362</strong> und ihre heute bekannten Unterzweige. Die angezeigten Jahreszahlen geben die von FamilyTreeDNA geschätzte Zeit des jeweils gemeinsamen väterlichen Vorfahren eines Zweiges an.","Die genetischen Ergebnisse werden hier mit den ältesten bisher bekannten Vorfahren aus den genealogischen Quellen verbunden. Dadurch lässt sich nachvollziehen, wie verschiedene heute bestehende Familiennamen auf eine einzige ältere gemeinsame väterliche Linie zurückführen.","Der <strong>gemeinsame Vorfahr dieser Linie</strong> lebte nach der derzeitigen Berechnung um das Jahr <strong>1293</strong>. Dies fällt in die Zeit der mittelalterlichen <strong>Besiedlung der Region Landskron</strong>, die vor allem im <strong>13. Jahrhundert</strong> erfolgte. Es ist daher sehr wahrscheinlich, dass <strong>R-BY92362 einen der frühen Siedler der Region oder einen unmittelbaren Nachkommen eines solchen Siedlers repräsentiert</strong>. Die darunterliegenden Zweige sind jünger und führen schließlich zu den historischen Familienlinien, die durch genealogische Quellen in der Region belegt werden konnten."],"familyIntro":[["Doležal / Doležel / Doleschel, Čenkovice (Tschenkowitz)","Meine eigene direkte väterliche Linie führt zu Jakub Doležal, der 1611 in Čenkovice (Tschenkowitz) ein Grundstück erwarb. Diese Linie ist heute dem genetischen Zweig <strong>R-FTA82359</strong> und seinen weiteren Unterzweigen zugeordnet."],["Knápek / Doležel, Cotkytle (Zottkittl) und Výprachtice (Weipersdorf)","Der Vorfahr der Familie Knápek war Martin Knápek, auch Doležel genannt, der bereits im Jahr 1618 in Cotkytle (Zottkittl) genannt wird und aus Výprachtice (Weipersdorf) stammte. Seine Linie ist dem Zweig <strong>R-FTD54476</strong> zugeordnet."],["Doleček, Mistrovice (Meistersdorf)","Die Familie Doleček aus Mistrovice (Meistersdorf) stammt von Jiří Doleček ab, der 1655 als Sohn von Václav Doleček in Mistrovice (Meistersdorf) geboren wurde. Die Linie gehört zum Zweig <strong>R-FTD95791</strong> (unterhalb von <strong>R-Y414921</strong>). Es gibt eine weitere Familie Doleček, die zum Oberzweig <strong>R-FTD96496</strong> gehört. Der Ahne dieser Linie ist Jan Doleček, der ca. 1621 geboren wurde und im Jahr 1639 einen Hof in Mistrovice (Meistersdorf) kaufte. Diese Linie repräsentiert den Oberzweig <strong>R-FTD96496</strong>."],["Dařílek, Dolní Heřmanice (Niederhermanitz)","Die Familie Dařílek stammt von Jakub Dařílek, geboren 1636 in Dolní Heřmanice (Niederhermanitz), ab. Die Linie ist dem Zweig <strong>R-BY116135</strong> unterhalb von <strong>R-Y414921</strong> zugeordnet."],["Koblížek / Koblischke","Auch die Familie Koblížek beziehungsweise Koblischke, die lange die Erbrichterfamilie von <strong>Čenkovice (Tschenkowitz)</strong> war, stammt von <strong>R-BY92362</strong> ab. In den frühesten Quellen ist diese Familie bereits in <strong>Čenkovice (Tschenkowitz), Bystřec (Waltersdorf), Jamné nad Orlicí (Jamnei an der Adler) und Jablonné nad Orlicí (Gabel an der Adler)</strong> belegt."],["Kobliška, Střechov nad Sázavou","Ein weiterer Zweig führt zur Familie Kobliška. Der Vorfahr dieser Familie war Augustin Koblížek, der 1729 in <strong>Střechov nad Sázavou</strong> auftaucht. Aufgrund des Nachnamens ist es höchstwahrscheinlich, dass er aus der Region Landskron kam. Der entsprechende genetische Zweig lautet <strong>R-FTG95567</strong>."]],"map_title":"Genetische Karte","map_intro":"Die Karte zeigt die historischen Herkunftsorte der untersuchten direkten väterlichen Linien.","map_note":"Die Marker zeigen den jeweiligen historischen Herkunftsort.","map_bigy_note":"Rot = mindestens ein Big-Y-Ergebnis an diesem Ort.","families_title":"Untersuchte Familien","search":"Nach Nachname, Ort oder Haplogruppe suchen …","ftdna":"FTDNA","participate_title":"Am Projekt teilnehmen","participate":["Gesucht werden Männer mit direkter väterlicher Abstammung aus der Region Landskron, Letohrad (Geiersberg) und Ústí nad Orlicí (Wildenschwert) und Umgebung. Ich unterstütze Interessierte bei ihrer Familienforschung und stelle kostenlos einen Family Finder Test von FamilyTreeDNA zur Verfügung, bei dem auch die Y-DNA Haplogruppe bestimmt wird, oder einen MyHeritage DNA Test, bei dem ebenfalls die Haplogruppe bestimmt wird.", "Falls ein Tester die Haplogruppe R-P278 hat, die Obergruppe meiner Haplogruppe R-BY92362, stelle ich kostenlos einen Big-Y Test von FamilyTreeDNA zur Verfügung. Mit diesem Test kann die genaue Untergruppe der väterlichen Linie bestimmt werden.", "Mein Ziel ist es, alle Familien in der Region zu finden, die von meinem Vorfahren R-BY92362 abstammen, und gleichzeitig auch alle anderen väterlichen Linien aus der Region zu untersuchen.", "Die Teilnahme ist sehr einfach. Um ein DNA-Testkit zu verschicken, benötige ich lediglich eine Postadresse, an die das Kit geschickt werden soll. Es werden keine Zahlungsdaten oder Bankinformationen benötigt.", "Die Probenentnahme ist bei den normalen Testkits von MyHeritage und FamilyTreeDNA sehr einfach: Etwa 30–60 Minuten vor der Probenentnahme sollte man nichts essen oder trinken. Für jede Wangeninnenseite wird ein eigener Abstrichtupfer verwendet. Mit dem ersten Tupfer wird etwa eine Minute lang kräftig über die Innenseite der einen Wange gestrichen und der Tupfer dabei mehrfach gedreht, damit genügend Zellen aufgenommen werden. Anschließend wird der Vorgang mit dem zweiten Tupfer auf der anderen Wangeninnenseite wiederholt. Die beiden Abstrichtupfer werden danach entsprechend der Anleitung des Testkits sicher in den dafür vorgesehenen Probenbehältern verschlossen. Anschließend werden die Proben mit dem beiliegenden Rücksendematerial an das Labor geschickt. Die gesamte Probenentnahme dauert nur wenige Minuten und ist schmerzfrei."],"steps":["Direkte väterliche Abstammung aus der Region", "Den ältesten bekannten Vorfahren der väterlichen Linie nennen und mich kontaktieren", "DNA-Testkit wird an die angegebene Postadresse geschickt – keine Zahlungs- oder Bankdaten erforderlich", "Wangenabstrich mit dem beiliegenden Tupfer durchführen und die Probe nach Kit-Anleitung zurückschicken", "Falls Ihre Haplogruppe dieselbe wie meine, R-P278, ist, finanziere ich einen Big-Y-Test von FamilyTreeDNA"],"source_kobliska_link":"Historische Quellen & Dokumente ansehen →","source_darilek_link":"Historische Quellen & Dokumente ansehen →","source_darilek_title":"Ältester Grundbucheintrag zur Familie Dařílek aus Heřmanice","source_dolecek_link":"Historische Quellen & Dokumente ansehen →","source_dolecek_title":"Ältester Grundbucheintrag zur Familie Doleček aus Mistrovice","source_knapek_link":"Historische Quellen & Dokumente ansehen →","source_knapek_title":"Ältester Grundbucheintrag zur Familie Knápek / Doležel aus Cotkytle","source_koblizek_link":"Historische Quellen & Dokumente ansehen →","source_koblizek_title":"Ältester Grundbucheintrag zur Familie Koblížek aus Čenkovice","source_dolezal_link":"Historische Quellen & Dokumente ansehen →","source_dolezal_title":"Ältester Grundbucheintrag zur Familie Doležal / Doležel aus Čenkovice","privacy_title":"Datenschutzerklärung","privacy":["Es werden keine Namen lebender DNA Tester veröffentlicht.","Öffentlich erscheinen nur genealogische Angaben zu historischen Vorfahren, Herkunftsorten und anonymisierte genetische Forschungsergebnisse.","Personenbezogene DNA Informationen werden nicht öffentlich mit der Identität eines Teilnehmers verknüpft."],"cta_title":"Stammt deine direkte väterliche Linie aus der Region?","cta_text":"Dann kontaktiere mich gerne.","contact":"Projektkontakt","privacy_link":"Datenschutzerklärung","footer":"Y-DNA Forschung in der Region Landskron","privacy_full":"<h3>1. Verantwortlicher</h3>\n<p>Verantwortlich für die Datenverarbeitung auf dieser Website ist:<br><strong>T. Doleschel</strong><br>E-Mail: <a href=\"mailto:familytreedna.doleschel@gmail.com\">familytreedna.doleschel@gmail.com</a></p>\n<p>Diese Website dient der privaten genealogischen und genetisch-genealogischen Forschung zu Familien und väterlichen Abstammungslinien aus der Region Landskron und den angrenzenden Gebieten.</p>\n\n<h3>2. Allgemeine Hinweise zur Datenverarbeitung</h3>\n<p>Personenbezogene Daten werden im Zusammenhang mit dieser Website nur verarbeitet, soweit dies für die Bereitstellung der Website, die Darstellung der Forschungsinhalte oder die Kommunikation im Rahmen des Forschungsprojekts erforderlich ist. Die Verarbeitung erfolgt nach Maßgabe der Datenschutz-Grundverordnung (DSGVO) und der sonstigen anwendbaren datenschutzrechtlichen Vorschriften.</p>\n\n<h3>3. Hosting über GitHub Pages</h3>\n<p>Diese Website wird über GitHub Pages, einen Dienst von GitHub, Inc., bereitgestellt. Beim Besuch der Website können technisch erforderliche Daten verarbeitet werden, insbesondere IP-Adresse, Datum und Uhrzeit des Zugriffs, aufgerufene Inhalte sowie Browser-, Geräte- und Verbindungsinformationen. GitHub gibt an, IP-Adressen von Besuchern einer GitHub-Pages-Website zu Sicherheitszwecken zu protokollieren und zu speichern.</p>\n<p>Weitere Informationen: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub General Privacy Statement</a>.</p>\n\n<h3>4. Leaflet, unpkg und OpenStreetMap</h3>\n<p>Für die interaktive Karte verwendet diese Website die JavaScript-Bibliothek Leaflet. Die dafür benötigten Leaflet-Dateien werden über das Content Delivery Network unpkg.com geladen. Beim Laden dieser Dateien wird eine Verbindung zu Servern des Anbieters hergestellt; dabei kann insbesondere die IP-Adresse des Besuchers übertragen werden.</p>\n<p>Die Kartendarstellung verwendet Kartenkacheln von OpenStreetMap. Beim Laden der Karte stellt der Browser eine Verbindung zur Infrastruktur her, über die diese Kartenkacheln bereitgestellt werden. Dabei können insbesondere IP-Adresse und technische Anfragedaten verarbeitet werden. Die Karte dient der geografischen Darstellung historischer Herkunftsorte der untersuchten Familienlinien.</p>\n<p>Weitere Informationen: <a href=\"https://osmfoundation.org/wiki/Privacy_Policy\" target=\"_blank\" rel=\"noopener noreferrer\">Datenschutzerklärung der OpenStreetMap Foundation</a>.</p>\n\n<h3>5. Genealogische Forschungsdaten</h3>\n<p>Auf dieser Website werden Ergebnisse genealogischer und genetisch-genealogischer Forschung dargestellt. Hierzu können insbesondere Familiennamen, Namen historischer Vorfahren, historische Lebensdaten und Herkunftsorte, genealogisch rekonstruierte Abstammungslinien sowie Y-DNA-Haplogruppen und deren Unterzweige gehören. Die Veröffentlichung dient der Erforschung und Dokumentation historischer väterlicher Abstammungslinien und ihrer Beziehungen zueinander.</p>\n\n<h3>6. Y-DNA-Daten und lebende Testteilnehmer</h3>\n<p><strong>Die Namen lebender DNA-Testteilnehmer werden auf dieser Website grundsätzlich nicht veröffentlicht.</strong> Die Darstellung erfolgt stattdessen anhand von Familiennamen, historischen Vorfahren, historischen Herkunftsorten und den für die jeweilige väterliche Linie ermittelten Y-DNA-Zweigen.</p>\n<p>Insbesondere werden grundsätzlich keine DNA-Rohdaten, vollständigen STR-Markerprofile, Listen privater genetischer Varianten, DNA-Kitnummern, privaten Anschriften oder sonstigen nicht für die Forschungsdarstellung erforderlichen Identifikationsdaten lebender Teilnehmer veröffentlicht. Bei der Veröffentlichung wird auf eine möglichst datensparsame Darstellung geachtet.</p>\n\n<h3>7. Genetische Daten</h3>\n<p>Genetische Daten einer identifizierten oder identifizierbaren natürlichen Person können besondere Kategorien personenbezogener Daten im Sinne von Art. 9 DSGVO darstellen. Soweit eine dargestellte genetische Information trotz der beschränkten Darstellung einer lebenden natürlichen Person zugeordnet werden kann, wird dies bei der datenschutzrechtlichen Bewertung der Veröffentlichung berücksichtigt. Soweit eine Veröffentlichung personenbezogener genetischer Daten auf einer Einwilligung beruht, kann diese mit Wirkung für die Zukunft widerrufen werden.</p>\n\n<h3>8. Angaben zu verstorbenen Personen</h3>\n<p>Der überwiegende Teil der namentlich dargestellten genealogischen Personen sind historische bzw. verstorbene Personen. Die DSGVO gilt grundsätzlich nicht für personenbezogene Daten Verstorbener. Dennoch wird darauf geachtet, durch historische Angaben nicht unnötig personenbezogene Informationen über heute lebende Angehörige offenzulegen.</p>\n\n<h3>9. FamilyTreeDNA und externe Links</h3>\n<p>Die Website enthält externe Links, insbesondere zu Informationsseiten von FamilyTreeDNA zu Y-DNA-Haplogruppen. Beim bloßen Anzeigen dieser Website wird die verlinkte Seite nicht automatisch aufgerufen. Erst beim Anklicken eines externen Links stellt der Browser eine Verbindung zum jeweiligen Anbieter her. Für die dortige Datenverarbeitung ist der jeweilige Betreiber verantwortlich.</p>\n\n<h3>10. Kontaktaufnahme per E-Mail</h3>\n<p>Bei einer Kontaktaufnahme per E-Mail werden die freiwillig übermittelten Daten, insbesondere E-Mail-Adresse, Nachrichteninhalt und gegebenenfalls Name, zur Bearbeitung der Anfrage und gegebenenfalls zur Kommunikation über genealogische Forschung oder eine Projektteilnahme verarbeitet.</p>\n\n<h3>11. Cookies, Werbung und Besucheranalyse</h3>\n<p>Der Betreiber dieser Website setzt nach der derzeitigen Gestaltung keine eigenen Analyse- oder Werbedienste wie Google Analytics, Google Ads oder Meta Pixel ein und erstellt keine eigenen personenbezogenen Besucherprofile zu Werbezwecken. Technisch erforderliche Verarbeitungen durch die eingebundenen Dienste bleiben hiervon unberührt.</p>\n\n<h3>12. Rechtsgrundlagen</h3>\n<p>Soweit personenbezogene Daten verarbeitet werden, richtet sich die Rechtsgrundlage nach Art und Zweck der jeweiligen Verarbeitung. Eine Verarbeitung zur Wahrung berechtigter Interessen kann insbesondere auf Art. 6 Abs. 1 lit. f DSGVO beruhen. Soweit eine Verarbeitung aufgrund einer Einwilligung erfolgt, richtet sie sich nach Art. 6 Abs. 1 lit. a DSGVO und bei besonderen Kategorien personenbezogener Daten gegebenenfalls zusätzlich nach Art. 9 Abs. 2 DSGVO.</p>\n\n<h3>13. Speicherdauer</h3>\n<p>Personenbezogene Daten werden nur so lange verarbeitet bzw. gespeichert, wie dies für den jeweiligen Zweck erforderlich ist oder eine Rechtsgrundlage für die weitere Aufbewahrung besteht. Für technische Daten, die unmittelbar von externen Anbietern verarbeitet werden, gelten zusätzlich deren jeweilige Speicher- und Löschregelungen. Genealogische Forschungsunterlagen können aufgrund ihres langfristigen Forschungs- und Dokumentationszwecks längerfristig aufbewahrt werden.</p>\n\n<h3>14. Rechte betroffener Personen</h3>\n<p>Soweit die gesetzlichen Voraussetzungen erfüllt sind, bestehen insbesondere Rechte auf Auskunft, Berichtigung, Löschung, Einschränkung der Verarbeitung, Datenübertragbarkeit (soweit anwendbar), Widerspruch sowie Widerruf einer erteilten Einwilligung mit Wirkung für die Zukunft. Betroffene Personen haben außerdem das Recht, sich bei einer zuständigen Datenschutzaufsichtsbehörde zu beschweren.</p>\n<p>Anfragen: <a href=\"mailto:familytreedna.doleschel@gmail.com\">familytreedna.doleschel@gmail.com</a></p>\n\n<h3>15. Berichtigung und Entfernung von Forschungsdaten</h3>\n<p>Sollten dargestellte genealogische Angaben unrichtig sein oder sollte eine lebende Person der Ansicht sein, dass eine veröffentlichte Information ihre personenbezogenen Daten betrifft, kann sie sich jederzeit an die oben genannte E-Mail-Adresse wenden. Der Sachverhalt wird geprüft; soweit erforderlich, werden Angaben berichtigt, weiter anonymisiert oder entfernt.</p>\n\n<h3>16. Änderungen dieser Datenschutzerklärung</h3>\n<p>Diese Datenschutzerklärung kann angepasst werden, wenn sich die Website, die verwendeten technischen Dienste, die dargestellten Forschungsdaten oder die rechtlichen Anforderungen ändern.</p>\n<p><strong>Stand: August 2026</strong></p>"},"en":{"stat_lines":"investigated lineages","stat_places":"places of origin","map_filter_label":"Filter by surname","map_filter_all":"All families","map_haplogroup_filter_label":"Most represented Y-DNA groups","map_haplogroup_all":"All haplogroups","surname_faq_question":"Why can men with the same surname have different Y-DNA results?","surname_faq_items":[["Different testing depth", "Not every test determines the haplogroup with the same level of precision. A Big-Y test provides a much deeper subbranch than, for example, Family Finder (an autosomal test) or Y-37 (an STR test). Two results can therefore look different even though they belong to the same paternal line."], ["Same surname and same place, but a different haplogroup", "There may have been several independent families with the same surname in the same place. Another possibility is an <strong>NPE</strong> (<em>Non-Paternity Event</em>). This means that at some point the biological paternal line does not match the genealogically documented line, for example because of adoption, a child born outside marriage, a stepfather, or another undocumented paternity situation."], ["Same surname, different place, same haplogroup", "This points to a shared direct male ancestor. His descendants may later have settled in different villages."], ["Same surname, different place, different haplogroup", "In that case, the same surname most likely arose independently and the families have different paternal origins. An NPE or other historical family circumstances are also possible. Y-DNA and genealogical sources should therefore always be considered together."]],"brand":"LANŠKROUN DNA","eyebrow":"T. DOLESCHEL · GENETIC GENEALOGY","title":"Y-DNA Research in the Lanškroun Region","hero":"Research into direct paternal lineages, long-established families and their genetic connections in the Lanškroun, Letohrad, Ústí nad Orlicí region and surrounding area.","hero_pill_1":"Direct paternal lines","hero_pill_2":"Genetics + sources","hero_pill_3":"Landskron region","hero_scene_kicker":"Core lineage","hero_scene_sub":"TMRCA approx. 1293","hero_scene_map_label":"Geographic scope","hero_scene_map_value":"Historical places","hero_scene_map_sub":"Lanškroun · Letohrad · Ústí n. O.","hero_scene_records_label":"Source base","hero_scene_records_value":"Church & land records","hero_scene_records_sub":"Genealogical research using original sources","hero_scene_project_label":"Research focus","hero_scene_project_value":"Families & haplogroups","hero_scene_project_sub":"Direct paternal lines from the region","hero_btn":"What is Y-DNA?","intro_skip":"SKIP INTRO","project_link":"FamilyTreeDNA – Lanškroun Region Project","nav_home":"Home","nav_ydna":"What is Y-DNA?","nav_results":"Results","nav_map":"Genetic Map","nav_families":"Families","nav_participate":"Participate","nav_privacy":"Privacy Policy","ydna_title":"What is Y-DNA?","ydna":["Y-DNA is passed exclusively along the direct paternal line, from father to son. A man therefore carries on his Y chromosome a genetic record of his paternal ancestors that can be passed down for many generations.","By examining specific changes on the Y chromosome, men can be assigned to different paternal lines based on their genetic similarities. These genetic lines can then be placed in a chronological context. The further back such a tree reaches, the older the shared paternal ancestor of a branch becomes.","For genealogical research, it is particularly interesting that these genetic lineages can be compared with long-established families and genealogical sources. If, for example, men with different present-day surnames share the same Y-DNA branch, it means that their direct paternal lines go back to a common ancestor who lived before the emergence of today's surnames.","This is where the project comes in: Y-DNA results are connected with church registers, land registers and other historical sources. In this way, the history of paternal lines may be traced further back than the written sources alone allow."],"results_title":"The Results of This Research","tree_title":"The Genetic Line R-BY92362","tmrca_info":"TMRCA stands for “Time to Most Recent Common Ancestor” and refers to the estimated time to the most recent shared paternal ancestor of a Y-DNA branch. The years shown are estimates from FamilyTreeDNA and are not exact documented birth years.","family_connections_title":"The Connection to the Historical Families","results_intro":["The following diagram shows my paternal lineage (haplogroup) <strong>R-BY92362</strong> and its currently known downstream branches. The years shown indicate FamilyTreeDNA's estimated time of the common paternal ancestor of each branch.","The genetic results are linked here with the earliest currently known ancestors from genealogical sources. This makes it possible to trace how different present-day surnames lead back to a single older shared paternal lineage.","The <strong>common ancestor of this lineage</strong> lived, according to the current estimate, around the year <strong>1293</strong>. This falls within the period of the medieval <strong>settlement of the Lanškroun region</strong>, which took place primarily during the <strong>13th century</strong>. It is therefore very likely that <strong>R-BY92362 represents one of the early settlers of the region or an immediate descendant of such a settler</strong>. The downstream branches are younger and ultimately lead to the historical family lineages that could be documented in the region through genealogical sources."],"familyIntro":[["Doležal / Doležel / Doleschel, Čenkovice","My own direct paternal line leads to Jakub Doležal, who acquired a property in Čenkovice in 1611. This line is now assigned to genetic branch <strong>R-FTA82359</strong> and its further subbranches."],["Knápek / Doležel, Cotkytle and Výprachtice","The ancestor of the Knápek family was Martin Knápek, also called Doležel, who is documented in Cotkytle in 1618 and came from Výprachtice. His line belongs to branch <strong>R-FTD54476</strong>."],["Doleček, Mistrovice","The Doleček family from Mistrovice descends from Jiří Doleček, who was born in Mistrovice in 1655 as the son of Václav Doleček. The line belongs to branch <strong>R-FTD95791</strong> (below <strong>R-Y414921</strong>). There is another Doleček family that belongs to the higher-level branch <strong>R-FTD96496</strong>. The ancestor of this line is Jan Doleček, who was born around 1621 and purchased a farm in Mistrovice in 1639. This line represents the upper branch <strong>R-FTD96496</strong>."],["Dařílek, Dolní Heřmanice","The Dařílek family descends from Jakub Dařílek, born in 1636 in Dolní Heřmanice. The line belongs to branch <strong>R-BY116135</strong> below <strong>R-Y414921</strong>."],["Koblížek / Koblischke","The Koblížek or Koblischke family, which for a long time was the hereditary reeve family of <strong>Čenkovice</strong>, also descends from <strong>R-BY92362</strong>. In the earliest sources, this family is already documented in <strong>Čenkovice, Bystřec, Jamné nad Orlicí and Jablonné nad Orlicí</strong>."],["Kobliška, Střechov nad Sázavou","Another branch leads to the Kobliška family. The ancestor of this family was Augustin Koblížek, who appears in <strong>Střechov nad Sázavou</strong> in 1729. Based on the surname, it is highly likely that he came from the Lanškroun region. The corresponding genetic branch is <strong>R-FTG95567</strong>."]],"map_title":"Genetic Map","map_intro":"The map shows the historical places of origin of the investigated direct paternal lines.","map_note":"The markers show the respective historical place of origin.","map_bigy_note":"Red = at least one Big-Y result at this place.","families_title":"Investigated Families","search":"Search by surname, place or haplogroup …","ftdna":"FTDNA","participate_title":"Participate in the Project","participate":["Men with direct paternal ancestry from the Lanškroun, Letohrad and Ústí nad Orlicí region and surrounding area are sought. I support interested participants with their family research and provide a free Family Finder test from FamilyTreeDNA, which also determines the Y-DNA haplogroup, or a MyHeritage DNA test, which likewise determines the haplogroup.", "If a tester has haplogroup R-P278, the parent group of my haplogroup R-BY92362, I provide a free Big-Y test from FamilyTreeDNA. This test can determine the precise subbranch of the paternal line.", "My goal is to identify all families in the region who descend from my ancestor R-BY92362 while also investigating all other paternal lines from the region.", "Participation is very simple. To send a DNA test kit, I only need a postal address to which the kit should be sent. No payment details or bank information are required.", "Sample collection with the standard MyHeritage and FamilyTreeDNA test kits is very simple: For about 30–60 minutes before collecting the sample, you should not eat or drink. A separate cheek swab is used for each inner cheek. With the first swab, firmly rub the inside of one cheek for about one minute while rotating the swab several times so that enough cells are collected. Then repeat the procedure with the second swab on the inside of the other cheek. Afterwards, securely place and seal both swabs in the sample containers provided, following the instructions included with the test kit. The samples are then returned to the laboratory using the enclosed return materials. The entire sample collection takes only a few minutes and is painless."],"steps":["Direct paternal ancestry from the region", "Provide the oldest known paternal ancestor and contact me", "The DNA test kit is sent to the postal address provided – no payment or bank details are required", "Take the cheek swab with the supplied swab and return the sample according to the kit instructions", "If your haplogroup is the same as mine, R-P278, I will fund a Big-Y test from FamilyTreeDNA"],"source_kobliska_link":"View historical sources & documents →","source_darilek_link":"View historical sources & documents →","source_darilek_title":"Oldest land register entry for the Dařílek family from Heřmanice","source_dolecek_link":"View historical sources & documents →","source_dolecek_title":"Oldest land register entry for the Doleček family from Mistrovice","source_knapek_link":"View historical sources & documents →","source_knapek_title":"Oldest land register entry for the Knápek / Doležel family from Cotkytle","source_koblizek_link":"View historical sources & documents →","source_koblizek_title":"Oldest land register entry for the Koblížek family from Čenkovice","source_dolezal_link":"View historical sources & documents →","source_dolezal_title":"Oldest land register entry for the Doležal / Doležel family from Čenkovice","privacy_title":"Privacy Policy","privacy":["No names of living DNA testers are published.","Only genealogical information about historical ancestors, places of origin and anonymised genetic research results is published.","Personal DNA information is not publicly linked to the identity of a participant."],"cta_title":"Does your direct paternal line come from the region?","cta_text":"Then feel free to contact me.","contact":"Project contact","privacy_link":"Privacy Policy","footer":"Y-DNA Research in the Lanškroun Region","privacy_full":"<h3>1. Controller</h3>\n<p>The controller responsible for data processing on this website is:<br><strong>T. Doleschel</strong><br>Email: <a href=\"mailto:familytreedna.doleschel@gmail.com\">familytreedna.doleschel@gmail.com</a></p>\n<p>This website is a private genealogical and genetic-genealogy research project concerning families and paternal lineages from the Lanškroun region and surrounding areas.</p>\n\n<h3>2. General information on data processing</h3>\n<p>Personal data are processed in connection with this website only insofar as necessary to provide the website, present the research content or communicate in connection with the research project. Processing is carried out in accordance with the General Data Protection Regulation (GDPR) and other applicable data-protection rules.</p>\n\n<h3>3. Hosting via GitHub Pages</h3>\n<p>This website is hosted using GitHub Pages, a service provided by GitHub, Inc. When the website is visited, technically necessary data may be processed, including the IP address, date and time of access, requested content, and browser, device and connection information. GitHub states that visitors' IP addresses are logged and stored for security purposes when a GitHub Pages site is visited.</p>\n<p>Further information: <a href=\"https://docs.github.com/en/site-policy/privacy-policies/github-general-privacy-statement\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub General Privacy Statement</a>.</p>\n\n<h3>4. Leaflet, unpkg and OpenStreetMap</h3>\n<p>This website uses the Leaflet JavaScript library for its interactive map. The required Leaflet files are loaded through the unpkg.com content delivery network. Loading these files establishes a connection to the provider's servers and may transmit the visitor's IP address.</p>\n<p>The map uses map tiles from OpenStreetMap. When the map is loaded, the browser connects to the infrastructure serving these tiles. In particular, the IP address and technical request data may be processed. The map is used to display the historical places of origin of the researched family lineages.</p>\n<p>Further information: <a href=\"https://osmfoundation.org/wiki/Privacy_Policy\" target=\"_blank\" rel=\"noopener noreferrer\">OpenStreetMap Foundation Privacy Policy</a>.</p>\n\n<h3>5. Genealogical research data</h3>\n<p>This website presents results of genealogical and genetic-genealogy research. These may include surnames, names of historical ancestors, historical dates and places of origin, genealogically reconstructed lineages, and Y-DNA haplogroups and downstream branches. Publication serves the research and documentation of historical paternal lineages and their relationships.</p>\n\n<h3>6. Y-DNA data and living test participants</h3>\n<p><strong>The names of living DNA test participants are generally not published on this website.</strong> Instead, results are presented by reference to surnames, historical ancestors, historical places of origin and the Y-DNA branches identified for the relevant paternal lineage.</p>\n<p>In particular, raw DNA data, complete STR marker profiles, lists of private genetic variants, DNA kit numbers, private addresses and other identifying information about living participants that is not required for the research presentation are generally not published. Data minimisation is taken into account when publishing research results.</p>\n\n<h3>7. Genetic data</h3>\n<p>Genetic data relating to an identified or identifiable natural person may constitute special categories of personal data within the meaning of Article 9 GDPR. Where genetic information displayed on the website can nevertheless be attributed to a living person, this is taken into account when assessing the data-protection basis for publication. Where publication of personal genetic data is based on consent, that consent may be withdrawn with effect for the future.</p>\n\n<h3>8. Information concerning deceased persons</h3>\n<p>Most named genealogical individuals displayed on the website are historical or deceased persons. The GDPR does not generally apply to personal data relating to deceased persons. Nevertheless, care is taken not to disclose unnecessary personal information about living relatives through historical genealogical information.</p>\n\n<h3>9. FamilyTreeDNA and external links</h3>\n<p>The website contains external links, in particular to FamilyTreeDNA information pages concerning Y-DNA haplogroups. Merely viewing this website does not automatically open the linked website. A connection to the external provider is established only when the visitor clicks the link. The respective operator is responsible for data processing on the external website.</p>\n\n<h3>10. Contact by email</h3>\n<p>If you contact the project by email, the information you voluntarily provide, in particular your email address, message content and, where applicable, your name, is processed to respond to the enquiry and, where relevant, to communicate about genealogical research or participation in the project.</p>\n\n<h3>11. Cookies, advertising and visitor analytics</h3>\n<p>In its current configuration, the website operator does not use its own analytics or advertising services such as Google Analytics, Google Ads or Meta Pixel and does not create its own personal visitor profiles for advertising purposes. Technically necessary processing by the external services used by the website remains unaffected.</p>\n\n<h3>12. Legal bases</h3>\n<p>Where personal data are processed, the applicable legal basis depends on the nature and purpose of the processing. Processing necessary for legitimate interests may in particular be based on Article 6(1)(f) GDPR. Where processing is based on consent, Article 6(1)(a) GDPR applies and, for special categories of personal data, Article 9(2) GDPR may additionally apply.</p>\n\n<h3>13. Storage period</h3>\n<p>Personal data are processed or stored only for as long as necessary for the relevant purpose or as long as a legal basis for further retention exists. Technical data processed directly by external providers are additionally subject to their respective retention and deletion policies. Genealogical research material may be retained for longer periods because of its long-term research and documentation purpose.</p>\n\n<h3>14. Rights of data subjects</h3>\n<p>Where the statutory requirements are met, data subjects may in particular have rights of access, rectification, erasure, restriction of processing, data portability where applicable, objection, and withdrawal of consent with effect for the future. Data subjects also have the right to lodge a complaint with a competent data-protection supervisory authority.</p>\n<p>Requests: <a href=\"mailto:familytreedna.doleschel@gmail.com\">familytreedna.doleschel@gmail.com</a></p>\n\n<h3>15. Correction and removal of research data</h3>\n<p>If genealogical information displayed on this website is inaccurate, or if a living person believes that published information concerns their personal data, they may contact the email address above at any time. The matter will be reviewed and, where necessary, the information will be corrected, further anonymised or removed.</p>\n\n<h3>16. Changes to this Privacy Policy</h3>\n<p>This Privacy Policy may be amended if the website, the technical services used, the research data displayed or the applicable legal requirements change.</p>\n<p><strong>Last updated: August 2026</strong></p>"},"cs":{"stat_lines":"zkoumaných linií","stat_places":"míst původu","map_filter_label":"Filtrovat podle příjmení","map_filter_all":"Všechny rodiny","map_haplogroup_filter_label":"Nejčastější Y-DNA skupiny","map_haplogroup_all":"Všechny haploskupiny","surname_faq_question":"Proč mohou mít muži se stejným příjmením různé výsledky Y-DNA?","surname_faq_items":[["Různá hloubka testování", "Ne každý test určuje haploskupinu se stejnou přesností. Test Big-Y poskytuje výrazně hlubší podvětev než například Family Finder (autosomální test) nebo Y-37 (STR test). Dva výsledky proto mohou vypadat odlišně, i když patří ke stejné otcovské linii."], ["Stejné příjmení a stejné místo, ale jiná haploskupina", "V jednom místě mohlo existovat několik nezávislých rodin se stejným příjmením. Další možností je takzvané <strong>NPE</strong> (<em>Non-Paternity Event</em>). To znamená, že biologická otcovská linie se v určitém bodě neshoduje s genealogicky doloženou linií, například kvůli adopci, nemanželskému dítěti, nevlastnímu otci nebo jiné nedoložené situaci otcovství."], ["Stejné příjmení, jiné místo, stejná haploskupina", "To ukazuje na společného přímého mužského předka. Jeho potomci se mohli později usadit v různých vesnicích."], ["Stejné příjmení, jiné místo, jiná haploskupina", "V takovém případě stejné příjmení s největší pravděpodobností vzniklo nezávisle a rodiny mají odlišný otcovský původ. Možné je ale také NPE nebo jiné historické rodinné okolnosti. Y-DNA a genealogické prameny je proto vždy nutné posuzovat společně."]],"brand":"LANŠKROUN DNA","eyebrow":"T. DOLESCHEL · GENETICKÁ GENEALOGIE","title":"Výzkum Y-DNA pro region Lanškroun","hero":"Výzkum přímých otcovských rodových linií, starousedlých rodin a jejich genetických vazeb v regionu Lanškroun, Letohrad, Ústí nad Orlicí a okolí.","hero_pill_1":"Přímé otcovské linie","hero_pill_2":"Genetika + prameny","hero_pill_3":"Region Lanškroun","hero_scene_kicker":"Hlavní linie","hero_scene_sub":"TMRCA přibl. 1293","hero_scene_map_label":"Geografický rozsah","hero_scene_map_value":"Historická místa","hero_scene_map_sub":"Lanškroun · Letohrad · Ústí n. O.","hero_scene_records_label":"Pramenná základna","hero_scene_records_value":"Matriky a gruntovní knihy","hero_scene_records_sub":"Genealogický výzkum s původními prameny","hero_scene_project_label":"Výzkumné zaměření","hero_scene_project_value":"Rodiny a haploskupiny","hero_scene_project_sub":"Přímé otcovské linie regionu","hero_btn":"Co je Y-DNA?","intro_skip":"PŘESKOČIT INTRO","project_link":"FamilyTreeDNA – Lanškroun Region Project","nav_home":"Úvod","nav_ydna":"Co je Y-DNA?","nav_results":"Výsledky","nav_map":"Genetická mapa","nav_families":"Rodiny","nav_participate":"Zapojení","nav_privacy":"Zásady ochrany osobních údajů","ydna_title":"Co je Y-DNA?","ydna":["Y-DNA se dědí výhradně v přímé otcovské linii, z otce na syna. Muž proto nese na chromozomu Y genetický otisk svých otcovských předků, který se může předávat po mnoho generací.","Zkoumáním určitých změn na chromozomu Y lze muže na základě jejich genetických shod přiřadit k různým otcovským liniím. Tyto genetické linie lze následně časově zařadit. Čím dále takový strom sahá do minulosti, tím starší je společný otcovský předek dané větve.","Pro genealogický výzkum je zvláště zajímavé, že tyto genetické linie lze porovnávat se starousedlými rodinami a genealogickými prameny. Pokud například muži s různými dnešními příjmeními sdílejí stejnou větev Y-DNA, znamená to, že jejich přímé otcovské linie vedou ke společnému předkovi, který žil před vznikem dnešních příjmení.","Právě na tom je tento projekt založen: výsledky testů Y-DNA jsou spojovány s matrikami, pozemkovými knihami a dalšími historickými prameny. Tímto způsobem lze historii otcovských linií sledovat možná dále do minulosti, než dovolují samotné písemné prameny."],"results_title":"Výsledky tohoto výzkumu","tree_title":"Genetická linie R-BY92362","tmrca_info":"TMRCA znamená „Time to Most Recent Common Ancestor“ a označuje odhadovanou dobu k nejmladšímu společnému otcovskému předkovi dané větve Y-DNA. Uvedené roky jsou odhady FamilyTreeDNA, nikoli přesně doložené roky narození.","family_connections_title":"Spojení s historickými rodinami","results_intro":["Následující diagram ukazuje mou otcovskou rodovou linii (haploskupinu) <strong>R-BY92362</strong> a její dnes známé podvětve. Uvedené letopočty označují odhadovaný čas společného otcovského předka jednotlivých větví podle FamilyTreeDNA.","Genetické výsledky jsou zde propojeny s nejstaršími dosud známými předky z genealogických pramenů. Díky tomu lze sledovat, jak různá dnešní příjmení vedou k jediné starší společné otcovské linii.","<strong>Společný předek této linie</strong> žil podle současného odhadu kolem roku <strong>1293</strong>. Toto období spadá do doby středověkého <strong>osidlování regionu Lanškroun</strong>, které probíhalo především ve <strong>13. století</strong>. Je proto velmi pravděpodobné, že <strong>R-BY92362 představuje jednoho z raných osadníků regionu nebo přímého potomka takového osadníka</strong>. Níže položené větve jsou mladší a nakonec vedou k historickým rodovým liniím, které se podařilo v regionu doložit genealogickými prameny."],"familyIntro":[["Doležal / Doležel / Doleschel, Čenkovice","Moje vlastní přímá otcovská linie vede k Jakubu Doležalovi, který v roce 1611 získal pozemek v Čenkovicích. Tato linie je dnes zařazena do genetické větve <strong>R-FTA82359</strong> a jejích dalších podvětví."],["Knápek / Doležel, Cotkytle a Výprachtice","Předkem rodiny Knápek byl Martin Knápek, také Doležel, který je doložen v Cotkytli již v roce 1618 a pocházel z Výprachtic. Jeho linie patří do větve <strong>R-FTD54476</strong>."],["Doleček, Mistrovice","Rodina Doleček z Mistrovic pochází od Jiřího Dolečka, který se narodil roku 1655 v Mistrovicích jako syn Václava Dolečka. Linie patří do větve <strong>R-FTD95791</strong> (pod <strong>R-Y414921</strong>). Existuje také další rodina Doleček, která patří do nadřazené větve <strong>R-FTD96496</strong>. Předkem této linie je Jan Doleček, který se narodil přibližně roku 1621 a v roce 1639 koupil v Mistrovicích grunt. Tato linie představuje nadřazenou větev <strong>R-FTD96496</strong>."],["Dařílek, Dolní Heřmanice","Rodina Dařílek pochází od Jakuba Dařílka, narozeného v roce 1636 v Dolní Heřmanice. Linie patří do větve <strong>R-BY116135</strong> pod <strong>R-Y414921</strong>."],["Koblížek / Koblischke","Také rodina Koblížek, respektive Koblischke, která byla po dlouhou dobu dědičnou rychtářskou rodinou v <strong>Čenkovicích</strong>, pochází z <strong>R-BY92362</strong>. V nejstarších pramenech je tato rodina doložena již v <strong>Čenkovicích, Bystřeci, Jamném nad Orlicí a Jablonném nad Orlicí</strong>."],["Kobliška, Střechov nad Sázavou","Další větev vede k rodině Kobliška. Předkem této rodiny byl Augustin Koblížek, který se roku 1729 objevuje ve <strong>Střechově nad Sázavou</strong>. Vzhledem k příjmení je velmi pravděpodobné, že pocházel z regionu Lanškroun. Odpovídající genetická větev je <strong>R-FTG95567</strong>."]],"map_title":"Genetická mapa","map_intro":"Mapa zobrazuje historická místa původu zkoumaných přímých otcovských linií.","map_note":"Markery zobrazují příslušné historické místo původu.","map_bigy_note":"Červená = alespoň jeden výsledek Big-Y v tomto místě.","families_title":"Zkoumané rodiny","search":"Hledat podle příjmení, místa nebo haploskupiny …","ftdna":"FTDNA","participate_title":"Zapojení do projektu","participate":["Hledám muže s přímým otcovským původem z oblasti Lanškroun, Letohrad a Ústí nad Orlicí a okolí. Zájemcům pomáhám s jejich rodinným výzkumem a poskytuji zdarma test Family Finder od FamilyTreeDNA, při kterém se určuje také haploskupina Y-DNA, nebo test MyHeritage DNA, při kterém se rovněž určuje haploskupina.", "Pokud má tester haploskupinu R-P278, což je nadřazená skupina mé haploskupiny R-BY92362, poskytnu zdarma test Big-Y od FamilyTreeDNA. Ten umožní určit přesnou podvětev otcovské linie.", "Mým cílem je najít všechny rodiny v regionu, které pocházejí od mého předka R-BY92362, a zároveň zkoumat i všechny další otcovské linie z tohoto regionu.", "Zapojení je velmi jednoduché. K odeslání DNA testovací sady potřebuji pouze poštovní adresu, na ktero \" target=\"_blank\" rel=\"noopener noreferrer\">GitHub General Privacy Statement</a>.</p>\n\n<h3>4. Leaflet, unpkg a OpenStreetMap</h3>\n<p>Pro interaktivní mapu používá tato stránka JavaScriptovou knihovnu Leaflet. Potřebné soubory Leaflet jsou načítány prostřednictvím sítě pro doručování obsahu unpkg.com. Při jejich načítání vzniká spojení se servery poskytovatele a může být přenesena zejména IP adresa návštěvníka.</p>\n<p>Mapa používá mapové dlaždice OpenStreetMap. Při načtení mapy se prohlížeč připojuje k infrastruktuře, která tyto dlaždice poskytuje. Mohou být zpracovávány zejména IP adresa a technické údaje o požadavku. Mapa slouží k zeměpisnému zobrazení historických míst původu zkoumaných rodových linií.</p>\n<p>Další informace: <a href=\"https://osmfoundation.org/wiki/Privacy_Policy\" target=\"_blank\" rel=\"noopener noreferrer\">Zásady ochrany osobních údajů OpenStreetMap Foundation</a>.</p>\n\n<h3>5. Genealogické výzkumné údaje</h3>\n<p>Na této stránce jsou zveřejňovány výsledky genealogického a geneticko-genealogického výzkumu. Mohou zahrnovat zejména příjmení, jména historických předků, historická data a místa původu, genealogicky rekonstruované rodové linie a haploskupiny Y-DNA včetně jejich podvětví. Zveřejnění slouží k výzkumu a dokumentaci historických otcovských rodových linií a jejich vzájemných vztahů.</p>\n\n<h3>6. Údaje Y-DNA a žijící testované osoby</h3>\n<p><strong>Jména žijících účastníků DNA testování nejsou na této webové stránce zásadně zveřejňována.</strong> Výsledky jsou místo toho zobrazovány prostřednictvím příjmení, historických předků, historických míst původu a větví Y-DNA zjištěných pro příslušnou otcovskou linii.</p>\n<p>Zásadně nejsou zveřejňována zejména surová data DNA, úplné profily markerů STR, seznamy soukromých genetických variant, čísla DNA kitů, soukromé adresy ani jiné identifikační údaje žijících účastníků, které nejsou pro prezentaci výzkumu nezbytné. Při zveřejňování je dbáno na minimalizaci údajů.</p>\n\n<h3>7. Gen function researchSortKey(s){
 return String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLocaleLowerCase();
}
function researchMembers(root,exclude){
 const subs=familySearchCladeGroups[root]||[root];
 return families.filter(f=>{
   if(exclude&&exclude(f))return false;
   const h2=secondaryHap(f);
   return subs.includes(f.haplogroup)||subs.includes(h2);
 }).slice().sort((a,b)=>{
   const sa=researchSortKey(a.surname),sb=researchSortKey(b.surname);
   if(sa!==sb)return sa.localeCompare(sb);
   return researchSortKey(a.place).localeCompare(researchSortKey(b.place));
 });
}

 <p><strong>Lorenz Doležal</strong></p>
 <p><strong>Im Jahre 1653:</strong> Richter und Gericht verkauften den Hof und das verwüstete Gebäude??? nach Jakub Doležal mit allem Zubehör an Lorenz Doležal für eine Summe von ?? SG, die jährlich mit 2 SG zu bezahlen ist.</p>
 <p><strong>Für das Jahr 1653:</strong> Zahlung aufgeschoben.</p>
 <p><strong>Für das Jahr 1654:</strong> Lorenz Doležal zahlte 2 SG; diese wurden Anna gegeben.</p>
 <p><strong>Für die Jahre 1655 und 1656:</strong> Zahlung aufgeschoben.</p>
 <p><strong>Für das Jahr 1657:</strong> Lorenz Doležal zahlte 2 SG; 1 SG wurde Barbora gegeben und 1 SG ihm selbst.</p>
 <p><strong>Für das Jahr 1658:</strong> Zahlung aufgeschoben.</p>
 <p><strong>Für das Jahr 1659:</strong> Lorenz Doležal zahlte 2 SG; 1 SG wurde Barbora gegeben und 1 SG ihm selbst.</p>
 <p><strong>Für das Jahr 1660:</strong> Zahlung aufgeschoben.</p>
 <p><strong>Für das Jahr 1661:</strong> Lorenz Doležal zahlte 2 SG; diese wurden Marianna gegeben.</p>
 <p><strong>Für das Jahr 1662:</strong> Zahlung aufgeschoben.</p>
 <p><strong>Für das Jahr 1663:</strong> Lorenz Doležal zahlte 2 SG; 1 SG wurde Anna und 1 SG Dob/Dol??? Barbora gegeben.</p>
 <p><strong>Für das Jahr 1664:</strong> Zahlung aufgeschoben.</p>
 <p><strong>Für das Jahr 1665:</strong> Lorenz Doležal zahlte 2 SG; 1 SG wurde Anna und 1 SG Lorenz gegeben.</p>
 <p><strong>Für das Jahr 1666:</strong> Lorenz Doležal zahlte 2 SG; diese wurden Jan (Hans) gegeben.</p>

  const browserLang=(navigator.language||navigator.userLanguage||'en').toLowerCase();
  if(skip){
    if(browserLang.startsWith('de')) skip.textContent='INTRO ÜBERSPRINGEN';
    else if(browserLang.startsWith('cs')) skip.textContent='PŘESKOČIT INTRO';
    else skip.textContent='SKIP INTRO';
  }

  const desktopSrc='assets/intro-desktop.mp4';
  const mobileSrc='assets/intro-mobile.mp4';
  const mq=window.matchMedia('(max-width: 700px), (orientation: portrait)');
  let closed=false;
  let currentSrc='';

  function chooseSrc(){
    return mq.matches ? mobileSrc : desktopSrc;
  }

  function setSource(src){
    currentSrc=src;
    video.pause();
    video.innerHTML='';
    const source=document.createElement('source');
    source.src=src;
    source.type='video/mp4';
    video.appendChild(source);
    video.load();
  }

  function loadIntroSource(force){
    const desired=chooseSrc();
    if(!force && currentSrc===desired)return;
    setSource(desired);
  }

  function closeIntro(){
    if(closed)return;closed=true;
    overlay.classList.add('is-hidden');
    document.body.classList.remove('intro-active');
    setTimeout(()=>{try{video.pause()}catch(e){}},950);
  }

  function tryPlay(){
    if(!closed){video.play().catch(()=>{});}
  }

  loadIntroSource(true);

  video.addEventListener('loadedmetadata', tryPlay);
  video.addEventListener('canplay', tryPlay);
  video.addEventListener('timeupdate',()=>{
    if(video.duration&&bar)bar.style.width=Math.min(100,(video.currentTime/video.duration)*100)+'%';
  });
  video.addEventListener('ended',closeIntro);
  video.addEventListener('error',()=>{
    if(currentSrc===mobileSrc){
      setSource(desktopSrc);
      setTimeout(tryPlay,150);
      return;
    }
    setTimeout(closeIntro,250);
  });
  skip.addEventListener('click',closeIntro);
  const onViewportChange=()=>{if(!closed){loadIntroSource();setTimeout(tryPlay,150);}};
  if(mq.addEventListener)mq.addEventListener('change',onViewportChange);
  else if(mq.addListener)mq.addListener(onViewportChange);
  setTimeout(tryPlay,250);
  setTimeout(closeIntro,12000);
})();
</script>

</body></html>
