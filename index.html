const i18n={"de":{"brand":"LANDSKRON DNA","eyebrow":"T. DOLESCHEL · GENETISCHE GENEALOGIE","title":"Y-DNA Forschung in der Region Landskron","hero":"Forschung zu direkten väterlichen Linien, historischen Familien und ihren genetischen Verbindungen in der Region Landskron, Letohrad und Ústí nad Orlicí und Umgebung.","hero_btn":"Was ist Y-DNA?","project_link":"FamilyTreeDNA – Lanškroun Region Project","nav_home":"Startseite","nav_ydna":"Was ist Y-DNA?","nav_results":"Ergebnisse","nav_map":"Genetische Karte","nav_families":"Familien","nav_participate":"Teilnahme","nav_privacy":"Datenschutz","ydna_title":"Was ist Y-DNA?","ydna":["Y-DNA wird ausschließlich entlang der direkten väterlichen Linie vom Vater an den Sohn weitergegeben. Ein Mann trägt daher auf seinem Y-Chromosom einen genetischen Abdruck seiner väterlichen Vorfahren, der über viele Generationen weitergegeben wird.","Durch die Untersuchung bestimmter Veränderungen auf dem Y-Chromosom können Männer anhand ihrer genetischen Gemeinsamkeiten verschiedenen väterlichen Linien zugeordnet werden. Diese genetischen Linien können anschließend zeitlich eingeordnet werden. Je weiter man in einem solchen Stammbaum zurückgeht, desto älter wird der gemeinsame väterliche Vorfahr eines Zweiges.","Für die genealogische Forschung ist besonders interessant, dass sich diese genetischen Linien mit historischen Familien und genealogischen Quellen vergleichen lassen. Wenn beispielsweise Männer mit unterschiedlichen heutigen Familiennamen denselben Y-DNA-Zweig teilen, kann dies darauf hinweisen, dass ihre direkten väterlichen Linien auf einen gemeinsamen Vorfahren zurückgehen, der lange vor der Entstehung der heutigen Familiennamen lebte.","Genau hier setzt dieses Projekt an: Die Ergebnisse der Y-DNA-Tests werden mit Kirchenbüchern, Grundbüchern und anderen historischen Quellen verbunden. Auf diese Weise lässt sich die Geschichte väterlicher Linien möglicherweise weiter zurückverfolgen, als es die schriftlichen Quellen allein erlauben.","<strong>Wichtig:</strong> Y-DNA untersucht dabei nur eine einzige Linie des Stammbaums, die ununterbrochene Linie vom Vater zum Vater zum Vater. Sie sagt daher nicht, dass zwei Menschen insgesamt eng miteinander verwandt sein müssen. Sie gibt vielmehr Auskunft über ihre gemeinsame direkte väterliche Abstammung."],"results_title":"Die Ergebnisse dieser Forschung","tree_title":"Die genetische Linie R-BY92362","family_connections_title":"Die Verbindung zu den historischen Familien","results_intro":["Das folgende Diagramm zeigt die väterliche Linie <strong>R-BY92362</strong> und ihre heute bekannten Unterzweige. Die angezeigten Jahreszahlen geben die von FamilyTreeDNA geschätzte Zeit des jeweils gemeinsamen väterlichen Vorfahren eines Zweiges an.","Die genetischen Ergebnisse werden hier mit den ältesten bisher bekannten Vorfahren aus den genealogischen Quellen verbunden. Dadurch lässt sich nachvollziehen, wie verschiedene heute bestehende Familiennamen auf ältere gemeinsame väterliche Linien zurückführen.","Der <strong>gemeinsame Vorfahr dieser Linie</strong> lebte nach der derzeitigen Berechnung um das Jahr <strong>1293</strong>. Die darunterliegenden Zweige sind jünger und führen schließlich zu den historischen Familienlinien, die durch genealogische Quellen in der Region belegt werden konnten."],"familyIntro":[["Doležal / Doležel / Doleschel, Čenkovice","Meine eigene direkte väterliche Linie führt zu Jakub Doležal, der 1611 in Čenkovice ein Grundstück erwarb. Diese Linie ist heute dem genetischen Zweig <strong>R-FTA82359</strong> und seinen weiteren Unterzweigen zugeordnet."],["Knápek / Doležel, Cotkytle und Výprachtice","Der Vorfahr der Familie Knápek war Martin Knápek, auch Doležel genannt, der bereits im Jahr 1618 in Cotkytle genannt wird und aus Výprachtice stammte. Seine Linie ist dem Zweig <strong>R-FTD54476</strong> zugeordnet."],["Doleček, Mistrovice","Die Familie Doleček aus Mistrovice stammt von Jiří Doleček ab, der 1655 als Sohn von Václav Doleček in Mistrovice geboren wurde. Die Linie gehört zum Zweig <strong>R-FTD96496</strong> und dessen weiteren Unterzweigen."],["Dařílek, Dolní Heřmanice","Die Familie Dařílek stammt von Jakub Dařílek, geboren 1636 in Dolní Heřmanice, ab. Die Linie ist dem Zweig <strong>R-BY116135</strong> unterhalb von <strong>R-Y414921</strong> zugeordnet."],["Koblížek / Koblischke","Auch die Familie Koblížek beziehungsweise Koblischke ist Bestandteil der Untersuchung. Historische Vertreter dieser Linie sind unter anderem in <strong>Čenkovice und Bystřec</strong> belegt."],["Kobliska, Střechov nad Sázavou","Ein weiterer Zweig führt zur Familie Kobliska. Der entsprechende genetische Zweig <strong>R-FTG95567</strong> lässt sich mit der genealogisch dokumentierten Linie aus <strong>Střechov nad Sázavou</strong> verbinden."]],"map_title":"Genetische Karte","map_intro":"Die Karte zeigt die historischen Herkunftsorte der untersuchten direkten väterlichen Linien.","map_note":"Die DNA Marker zeigen den jeweiligen historischen Herkunftsort.","families_title":"Untersuchte Familien","search":"Nach Nachname, Ort oder Haplogruppe suchen …","ftdna":"FTDNA","participate_title":"Am Projekt teilnehmen","participate":["Gesucht werden Männer mit direkter väterlicher Abstammung aus der Region Landskron, Letohrad und Ústí nad Orlicí und Umgebung. Ich unterstütze Interessierte bei ihrer Familienforschung und stelle kostenlos einen Family Finder Test von FamilyTreeDNA zur Verfügung, bei dem auch die Y-DNA Haplogruppe bestimmt wird, oder einen MyHeritage DNA Test, bei dem ebenfalls die Haplogruppe bestimmt wird.","Falls ein Tester die Haplogruppe R-P278 hat, die Obergruppe meiner Haplogruppe R-BY92362, stelle ich kostenlos einen Big-Y Test von FamilyTreeDNA zur Verfügung. Mit diesem Test kann die genaue Untergruppe der väterlichen Linie bestimmt werden.","Mein Ziel ist es, alle Familien in der Region zu finden, die von meinem Vorfahren R-BY92362 abstammen, und gleichzeitig auch alle anderen väterlichen Linien aus der Region zu untersuchen."],"steps":["Direkte väterliche Abstammung aus der Region","Den ältesten bekannten Vorfahren der väterlichen Linie nennen und mich kontaktieren","Kostenloser MyHeritage DNA Test oder Family Finder Test von FamilyTreeDNA","Bei R-P278 kostenloser Big-Y Test von FamilyTreeDNA","Gemeinsame weitere Erforschung der Familiengeschichte"],"privacy_title":"Datenschutz","privacy":["Es werden keine Namen lebender DNA Tester veröffentlicht.","Öffentlich erscheinen nur genealogische Angaben zu historischen Vorfahren, Herkunftsorten und anonymisierte genetische Forschungsergebnisse.","Personenbezogene DNA Informationen werden nicht öffentlich mit der Identität eines Teilnehmers verknüpft."],"cta_title":"Stammt deine direkte väterliche Linie aus der Region?","cta_text":"Dann kontaktiere mich gerne.","contact":"Projektkontakt","privacy_link":"Datenschutz","footer":"Y-DNA Forschung in der Region Landskron"},"en":{"brand":"LANŠKROUN DNA","eyebrow":"T. DOLESCHEL · GENETIC GENEALOGY","title":"Y-DNA Research in the Lanškroun Region","hero":"Research into direct paternal lines, historical families and their genetic connections in the Lanškroun, Letohrad and Ústí nad Orlicí region and surrounding area.","hero_btn":"What is Y-DNA?","project_link":"FamilyTreeDNA – Lanškroun Region Project","nav_home":"Home","nav_ydna":"What is Y-DNA?","nav_results":"Results","nav_map":"Genetic Map","nav_families":"Families","nav_participate":"Participate","nav_privacy":"Privacy","ydna_title":"What is Y-DNA?","ydna":["Y-DNA is passed exclusively along the direct paternal line, from father to son. A man therefore carries on his Y chromosome a genetic record of his paternal ancestors that can be passed down for many generations.","By examining specific changes on the Y chromosome, men can be assigned to different paternal lines based on their genetic similarities. These genetic lines can then be placed in a chronological context. The further back such a tree reaches, the older the shared paternal ancestor of a branch becomes.","For genealogical research, it is especially useful that these genetic lines can be compared with historical families and genealogical sources. If men with different present-day surnames share the same Y-DNA branch, this may indicate that their direct paternal lines descend from a common ancestor who lived long before the emergence of today's hereditary surnames.","This is where the project comes in: Y-DNA results are connected with church registers, land registers and other historical sources. In this way, the history of paternal lines may be traced further back than the written sources alone allow.","<strong>Important:</strong> Y-DNA examines only one line of a family tree, the uninterrupted line from father to father to father. It therefore does not mean that two people must be closely related overall. It provides information specifically about their shared direct paternal ancestry."],"results_title":"The Results of This Research","tree_title":"The Genetic Line R-BY92362","family_connections_title":"The Connection to the Historical Families","results_intro":["The following diagram shows the paternal line <strong>R-BY92362</strong> and its currently known subbranches. The dates shown indicate the estimated time of the shared paternal ancestor of each branch, as calculated by FamilyTreeDNA.","The genetic results are presented together with the oldest known ancestors identified through genealogical sources. This makes it possible to trace how different family names that exist today can be connected to older shared paternal lines.","According to the current calculation, the <strong>common ancestor of this line</strong> lived around the year <strong>1293</strong>. The branches below are younger and eventually lead to historical family lines documented through genealogical sources in the region."],"familyIntro":[["Doležal / Doležel / Doleschel, Čenkovice","My own direct paternal line leads to Jakub Doležal, who acquired a property in Čenkovice in 1611. This line is now assigned to genetic branch <strong>R-FTA82359</strong> and its further subbranches."],["Knápek / Doležel, Cotkytle and Výprachtice","The ancestor of the Knápek family was Martin Knápek, also called Doležel, who is documented in Cotkytle in 1618 and came from Výprachtice. His line belongs to branch <strong>R-FTD54476</strong>."],["Doleček, Mistrovice","The Doleček family of Mistrovice descends from Jiří Doleček, who was born in Mistrovice in 1655 as the son of Václav Doleček. The line belongs to branch <strong>R-FTD96496</strong> and its further subbranches."],["Dařílek, Dolní Heřmanice","The Dařílek family descends from Jakub Dařílek, born in 1636 in Dolní Heřmanice. The line belongs to branch <strong>R-BY116135</strong> below <strong>R-Y414921</strong>."],["Koblížek / Koblischke","The Koblížek or Koblischke family is also part of the investigation. Historical representatives of this line are documented, among other places, in <strong>Čenkovice and Bystřec</strong>."],["Kobliska, Střechov nad Sázavou","Another branch leads to the Kobliska family. The corresponding genetic branch <strong>R-FTG95567</strong> can be connected with the genealogically documented line from <strong>Střechov nad Sázavou</strong>."]],"map_title":"Genetic Map","map_intro":"The map shows the historical places of origin of the investigated direct paternal lines.","map_note":"The DNA markers show the respective historical place of origin.","families_title":"Investigated Families","search":"Search by surname, place or haplogroup …","ftdna":"FTDNA","participate_title":"Participate in the Project","participate":["Men with direct paternal ancestry from the Lanškroun, Letohrad and Ústí nad Orlicí region and surrounding area are sought. I support interested participants with their family research and provide a free Family Finder test from FamilyTreeDNA, which also determines the Y-DNA haplogroup, or a MyHeritage DNA test, which likewise determines the haplogroup.","If a tester has haplogroup R-P278, the parent group of my haplogroup R-BY92362, I provide a free Big-Y test from FamilyTreeDNA. This test can determine the precise subbranch of the paternal line.","My goal is to identify all families in the region who descend from my ancestor R-BY92362 while also investigating all other paternal lines from the region."],"steps":["Direct paternal ancestry from the region","Provide the oldest known paternal ancestor and contact me","Free MyHeritage DNA test or Family Finder test from FamilyTreeDNA","Free Big-Y test from FamilyTreeDNA if R-P278","Further family history research together"],"privacy_title":"Privacy","privacy":["No names of living DNA testers are published.","Only genealogical information about historical ancestors, places of origin and anonymised genetic research results is published.","Personal DNA information is not publicly linked to the identity of a participant."],"cta_title":"Does your direct paternal line come from the region?","cta_text":"Then feel free to contact me.","contact":"Project contact","privacy_link":"Privacy","footer":"Y-DNA Research in the Lanškroun Region"},"cs":{"brand":"LANŠKROUN DNA","eyebrow":"T. DOLESCHEL · GENETICKÁ GENEALOGIE","title":"Výzkum Y-DNA pro region Lanškroun","hero":"Výzkum přímých otcovských linií, historických rodin a jejich genetických souvislostí v oblasti Lanškroun, Letohrad a Ústí nad Orlicí a v okolí.","hero_btn":"Co je Y-DNA?","project_link":"FamilyTreeDNA – Lanškroun Region Project","nav_home":"Úvod","nav_ydna":"Co je Y-DNA?","nav_results":"Výsledky","nav_map":"Genetická mapa","nav_families":"Rodiny","nav_participate":"Zapojení","nav_privacy":"Ochrana soukromí","ydna_title":"Co je Y-DNA?","ydna":["Y-DNA se dědí výhradně v přímé otcovské linii, z otce na syna. Muž proto nese na chromozomu Y genetický otisk svých otcovských předků, který se může předávat po mnoho generací.","Zkoumáním určitých změn na chromozomu Y lze muže na základě jejich genetických shod přiřadit k různým otcovským liniím. Tyto genetické linie lze následně časově zařadit. Čím dále takový strom sahá do minulosti, tím starší je společný otcovský předek dané větve.","Pro genealogický výzkum je zvláště zajímavé, že tyto genetické linie lze porovnávat s historickými rodinami a genealogickými prameny. Pokud například muži s různými dnešními příjmeními sdílejí stejnou větev Y-DNA, může to naznačovat, že jejich přímé otcovské linie pocházejí od společného předka, který žil dávno před vznikem dnešních dědičných příjmení.","Právě na tom je tento projekt založen: výsledky testů Y-DNA jsou spojovány s matrikami, pozemkovými knihami a dalšími historickými prameny. Tímto způsobem lze historii otcovských linií sledovat možná dále do minulosti, než dovolují samotné písemné prameny.","<strong>Důležité:</strong> Y-DNA zkoumá pouze jednu jedinou linii rodokmenu, nepřerušenou linii od otce k otci k otci. Neznamená tedy, že dva lidé musí být celkově blízce příbuzní. Poskytuje informace konkrétně o jejich společném přímém otcovském původu."],"results_title":"Výsledky tohoto výzkumu","tree_title":"Genetická linie R-BY92362","family_connections_title":"Spojení s historickými rodinami","results_intro":["Následující diagram zobrazuje otcovskou linii <strong>R-BY92362</strong> a její dnes známá podvětví. Uvedené letopočty představují odhadovaný čas společného otcovského předka jednotlivých větví podle FamilyTreeDNA.","Genetické výsledky jsou zde spojeny s nejstaršími dosud známými předky doloženými genealogickými prameny. Díky tomu lze sledovat, jak mohou různá dnešní příjmení souviset se staršími společnými otcovskými liniemi.","Podle současného výpočtu žil <strong>společný předek této linie</strong> přibližně kolem roku <strong>1293</strong>. Níže uvedené větve jsou mladší a postupně vedou k historickým rodovým liniím, které se podařilo doložit genealogickými prameny v regionu."],"familyIntro":[["Doležal / Doležel / Doleschel, Čenkovice","Moje vlastní přímá otcovská linie vede k Jakubu Doležalovi, který v roce 1611 získal pozemek v Čenkovicích. Tato linie je dnes zařazena do genetické větve <strong>R-FTA82359</strong> a jejích dalších podvětví."],["Knápek / Doležel, Cotkytle a Výprachtice","Předkem rodiny Knápek byl Martin Knápek, také Doležel, který je doložen v Cotkytli již v roce 1618 a pocházel z Výprachtic. Jeho linie patří do větve <strong>R-FTD54476</strong>."],["Doleček, Mistrovice","Rodina Doleček z Mistrovic pochází od Jiřího Dolečka, který se narodil v Mistrovicích v roce 1655 jako syn Václava Dolečka. Linie patří do větve <strong>R-FTD96496</strong> a jejích dalších podvětví."],["Dařílek, Dolní Heřmanice","Rodina Dařílek pochází od Jakuba Dařílka, narozeného v roce 1636 v Dolní Heřmanice. Linie patří do větve <strong>R-BY116135</strong> pod <strong>R-Y414921</strong>."],["Koblížek / Koblischke","Rodina Koblížek neboli Koblischke je rovněž součástí výzkumu. Historické představitele této linie lze doložit mimo jiné v <strong>Čenkovicích a Bystřeci</strong>."],["Kobliska, Střechov nad Sázavou","Další větev vede k rodině Kobliska. Příslušná genetická větev <strong>R-FTG95567</strong> se spojuje s genealogicky doloženou linií ze <strong>Střechova nad Sázavou</strong>."]],"map_title":"Genetická mapa","map_intro":"Mapa zobrazuje historická místa původu zkoumaných přímých otcovských linií.","map_note":"DNA markery zobrazují příslušné historické místo původu.","families_title":"Zkoumané rodiny","search":"Hledat podle příjmení, místa nebo haploskupiny …","ftdna":"FTDNA","participate_title":"Zapojení do projektu","participate":["Hledám muže s přímým otcovským původem z oblasti Lanškroun, Letohrad a Ústí nad Orlicí a okolí. Zájemcům pomáhám s jejich rodinným výzkumem a poskytuji zdarma test Family Finder od FamilyTreeDNA, při kterém se určuje také haploskupina Y-DNA, nebo test MyHeritage DNA, při kterém se rovněž určuje haploskupina.","Pokud má tester haploskupinu R-P278, což je nadřazená skupina mé haploskupiny R-BY92362, poskytnu zdarma test Big-Y od FamilyTreeDNA. Ten umožní určit přesnou podvětev otcovské linie.","Mým cílem je najít všechny rodiny v regionu, které pocházejí od mého předka R-BY92362, a zároveň zkoumat i všechny další otcovské linie z tohoto regionu."],"steps":["Přímý otcovský původ z regionu","Uvést nejstaršího známého předka v otcovské linii a kontaktovat mě","Bezplatný test MyHeritage DNA nebo Family Finder od FamilyTreeDNA","Při R-P278 bezplatný test Big-Y od FamilyTreeDNA","Společný další výzkum rodinné historie"],"privacy_title":"Ochrana soukromí","privacy":["Jména žijících DNA testerů nejsou zveřejňována.","Veřejně jsou uváděny pouze genealogické údaje o historických předcích, místech původu a anonymizované výsledky genetického výzkumu.","Osobní údaje DNA nejsou veřejně spojovány s identitou účastníka."],"cta_title":"Pochází vaše přímá otcovská linie z tohoto regionu?","cta_text":"Neváhejte mě kontaktovat.","contact":"Kontakt na projekt","privacy_link":"Ochrana soukromí","footer":"Výzkum Y-DNA pro region Lanškroun"}};

function renderFamilies(){
 const locale=lang==='cs'?'cs-CZ':lang==='de'?'de-DE':'en-US';
 const q=(document.getElementById('family-search').value||'').toLocaleLowerCase(locale).trim();
 const collator=new Intl.Collator(locale,{sensitivity:'base',numeric:true});
 const list=families.filter(f=>[f.surname,f.place,f.ancestor,f.haplogroup,f.year].join(' ').toLocaleLowerCase(locale).includes(q)).slice().sort((a,b)=>collator.compare(a.surname,b.surname)||collator.compare(a.place,b.place));
 document.getElementById('family-count').textContent=list.length+' / '+families.length;
 document.getElementById('family-grid').innerHTML=list.map(f=>`<article class="family-card"><h3>${esc(f.surname)}</h3><div class="meta">${esc(f.place)}${f.ancestor?' · '+esc(f.ancestor):''}${f.year?' · '+esc(f.year):''}</div><div class="bottom"><span class="hap">${esc(f.haplogroup)}</span><a class="ftdna" href="${ftdna(f.haplogroup)}" target="_blank" rel="noopener">${i18n[lang].ftdna}</a></div></article>`).join('');
}

function renderLanguage(){
 document.documentElement.lang=lang; document.title=i18n[lang].title;
 document.querySelectorAll('[data-i18n]').forEach(el=>{const k=el.dataset.i18n;if(i18n[lang][k]!==undefined)el.innerHTML=i18n[lang][k];});
 document.getElementById('ydna-content').innerHTML=i18n[lang].ydna.map(p=>'<p>'+p+'</p>').join('');
 document.getElementById('results-intro').innerHTML=i18n[lang].results_intro.map(p=>'<p>'+p+'</p>').join('');
 document.getElementById('family-explanations').innerHTML=i18n[lang].familyIntro.map(x=>`<article class="family-explanation"><h3>${x[0]}</h3><p>${x[1]}</p></article>`).join('');
 document.getElementById('participate-content').innerHTML=i18n[lang].participate.map(p=>'<p>'+p+'</p>').join('');
 document.getElementById('steps').innerHTML=i18n[lang].steps.map((s,i)=>`<div class="step"><b>${String(i+1).padStart(2,'0')}</b>${s}</div>`).join('');
 document.getElementById('privacy-content').innerHTML=i18n[lang].privacy.map(p=>'<p>'+p+'</p>').join('');
 document.getElementById('family-search').placeholder=i18n[lang].search;
 document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('active',b.dataset.lang===lang));
 renderTree();renderFamilies();renderMap();
}
